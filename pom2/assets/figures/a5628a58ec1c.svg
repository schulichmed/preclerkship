<path d="M510.0 599.0C510.0 628.5 455.0 628.5 455.0 658.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M560.0 522.0L560.0 555.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M560.0 447.0L560.0 478.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
