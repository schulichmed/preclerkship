<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1170" viewBox="0 0 1120 1170" role="img" aria-labelledby="t"><title id="t">Adrenal disease work-up: for too much hormone, screen, confirm and localise by zone; for too little, a morning cortisol with paired ACTH separates ruled out, stimulation test, primary and secondary; screen every incidentaloma for all three; treat a crisis before results</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M860.0 1012.0C860.0 1040.0 960.0 1040.0 960.0 1068.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
