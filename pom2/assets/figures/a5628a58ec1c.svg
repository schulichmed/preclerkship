<path d="M690 186.5H1105V800.5H722" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M560.0 207.0L560.0 248.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
