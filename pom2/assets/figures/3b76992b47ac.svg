<text x="64.0" y="209.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Alcohol</tspan></text>
<text x="64.0" y="233.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">Zero is safest; low levels unlikely to</tspan></text>
<text x="64.0" y="252.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">harm.</tspan></text>
<rect x="64.0" y="264.0" width="78.6" height="20.0" rx="10" fill="#e2f2ea"/>
<text x="103.3" y="278.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">zero safest</text>
<line x1="38.0" y1="204.0" x2="52.0" y2="204.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="52.0" y="304.0" width="271.5" height="110.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="64.0" y="329.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#1f5f9e">★</tspan><tspan font-weight="700" fill="#18212e"> Exercise</tspan></text>
<text x="64.0" y="353.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">Aerobic + strength, whatever her prior</tspan></text>
<text x="64.0" y="372.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">level.</tspan></text>
<rect x="64.0" y="384.0" width="77.0" height="20.0" rx="10" fill="#f6f7f9" stroke="#c9d0db" stroke-width="1"/>
<text x="102.5" y="398.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#5a6577" text-anchor="middle">PARmed-X</text>
<line x1="38.0" y1="324.0" x2="52.0" y2="324.0" stroke="#c9d0db" stroke-width="2"/>
