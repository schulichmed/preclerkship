<text x="38.0" y="139.1" font-family="Georgia, 'DejaVu Serif', serif" font-size="18" text-anchor="start"><tspan font-weight="700" fill="#2f7d5b">Lifestyle</tspan></text>
<text x="38.0" y="157.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#18212e">Safer than she fears.</tspan></text>
