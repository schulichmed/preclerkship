<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="553" viewBox="0 0 1300 553" role="img" aria-labelledby="t"><title id="t">Early pregnancy counselling: what to tell her about lifestyle, substances and medicines, food, travel and nausea</title><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
