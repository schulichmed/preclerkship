<text x="64.0" y="449.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Weight gain</tspan></text>
<text x="64.0" y="473.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">Lower BMI → gain more; discuss</tspan></text>
<text x="64.0" y="492.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">respectfully.</tspan></text>
<line x1="38.0" y1="444.0" x2="52.0" y2="444.0" stroke="#c9d0db" stroke-width="2"/>
<line x1="38.0" y1="174.0" x2="38.0" y2="444.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="341.5" y="108.0" width="299.5" height="66.0" rx="10" fill="#e0f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="355.5" y="139.1" font-family="Georgia, 'DejaVu Serif', serif" font-size="18" text-anchor="start"><tspan font-weight="700" fill="#1f6f8b">Substances + medicines</tspan></text>
<text x="355.5" y="157.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#18212e">Ask everyone, periodically.</tspan></text>
<rect x="369.5" y="184.0" width="271.5" height="110.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="381.5" y="209.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Tobacco, cannabis</tspan></text>
<text x="381.5" y="233.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">Adverse pregnancy + childhood</tspan></text>
<text x="381.5" y="252.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">outcomes.</tspan></text>
<rect x="381.5" y="264.0" width="71.0" height="20.0" rx="10" fill="#fbe5e3"/>
<text x="417.0" y="278.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#b3261e" text-anchor="middle">cessation</text>
<line x1="355.5" y1="204.0" x2="369.5" y2="204.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="369.5" y="304.0" width="271.5" height="83.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="381.5" y="329.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#1f5f9e">★</tspan><tspan font-weight="700" fill="#18212e"> Likely safe</tspan></text>
<text x="381.5" y="353.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">Antihistamines, antiemetics, puffers,</tspan></text>
<text x="381.5" y="372.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">antidepressants, common antibiotics.</tspan></text>
<line x1="355.5" y1="324.0" x2="369.5" y2="324.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="369.5" y="397.0" width="271.5" height="110.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="381.5" y="422.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">SSRIs</tspan></text>
<text x="381.5" y="446.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">No birth defects; slight ↑ postpartum</tspan></text>
<text x="381.5" y="465.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">hemorrhage.</tspan></text>
