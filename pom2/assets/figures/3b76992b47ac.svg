<text x="406.0" y="491.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#a45a12" text-anchor="middle">PPH ↑</text>
<line x1="355.5" y1="417.0" x2="369.5" y2="417.0" stroke="#c9d0db" stroke-width="2"/>
<line x1="355.5" y1="174.0" x2="355.5" y2="417.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="659.0" y="108.0" width="299.5" height="84.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="673.0" y="139.1" font-family="Georgia, 'DejaVu Serif', serif" font-size="18" text-anchor="start"><tspan font-weight="700" fill="#a45a12">Food</tspan></text>
<text x="673.0" y="157.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#18212e">Undercooked meat, not cats, is the toxo</tspan></text>
<text x="673.0" y="175.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#18212e">risk.</tspan></text>
<rect x="687.0" y="202.0" width="271.5" height="83.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="699.0" y="227.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Very low risk</tspan></text>
<text x="699.0" y="251.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">Raw eggs, deli meat, soft cheese,</tspan></text>
<text x="699.0" y="270.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">sushi, most fish.</tspan></text>
<line x1="673.0" y1="222.0" x2="687.0" y2="222.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="687.0" y="295.0" width="271.5" height="123.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="699.0" y="320.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#1f5f9e">★</tspan><tspan font-weight="700" fill="#18212e"> Avoid or limit</tspan></text>
<text x="699.0" y="344.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">Undercooked meat → toxoplasmosis;</tspan></text>
<text x="699.0" y="363.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">top-predator fish (mercury).</tspan></text>
<text x="699.0" y="387.1" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" text-anchor="start"><tspan font-weight="700" fill="#b3261e">Toxo:</tspan><tspan font-weight="400" fill="#b3261e"> chorioretinitis, hydrocephalus,</tspan></text>
<text x="699.0" y="404.1" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" text-anchor="start"><tspan font-weight="400" fill="#b3261e">intracranial calcifications.</tspan></text>
<line x1="673.0" y1="315.0" x2="687.0" y2="315.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="687.0" y="428.0" width="271.5" height="91.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="699.0" y="453.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Caffeine</tspan></text>
<text x="699.0" y="477.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">≤ 300 mg/day (≈ 2 cups) is safe.</tspan></text>
<rect x="699.0" y="489.0" width="66.8" height="20.0" rx="10" fill="#e2f2ea"/>
<text x="732.4" y="503.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">≤ 300 mg</text>
<line x1="673.0" y1="448.0" x2="687.0" y2="448.0" stroke="#c9d0db" stroke-width="2"/>
<line x1="673.0" y1="192.0" x2="673.0" y2="448.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="976.5" y="108.0" width="299.5" height="84.0" rx="10" fill="#f8e4ee" stroke="#a3366b" stroke-width="1.5"/>
<text x="990.5" y="139.1" font-family="Georgia, 'DejaVu Serif', serif" font-size="18" text-anchor="start"><tspan font-weight="700" fill="#a3366b">Travel + nausea</tspan></text>
<text x="990.5" y="157.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#18212e">NVP: from 4 wk, peaks 9 wk, gone by end</tspan></text>
<text x="990.5" y="175.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#18212e">of T1.</tspan></text>
<rect x="1004.5" y="202.0" width="271.5" height="110.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="1016.5" y="227.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Travel</tspan></text>
<text x="1016.5" y="251.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">Safest 18–23 wk; insurance rarely</tspan></text>
<text x="1016.5" y="270.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">covers the baby.</tspan></text>
<rect x="1016.5" y="282.0" width="68.3" height="20.0" rx="10" fill="#e2f2ea"/>
<text x="1050.6" y="296.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="11.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">18–23 wk</text>
<line x1="990.5" y1="222.0" x2="1004.5" y2="222.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="1004.5" y="322.0" width="271.5" height="104.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="1016.5" y="347.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#1f5f9e">★</tspan><tspan font-weight="700" fill="#18212e"> Nausea + vomiting</tspan></text>
<text x="1016.5" y="371.6" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">Ginger, acupressure first.</tspan></text>
<text x="1016.5" y="395.1" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Drugs:</tspan><tspan font-weight="400" fill="#18212e"> doxylamine/pyridoxine,</tspan></text>
<text x="1016.5" y="412.1" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" text-anchor="start"><tspan font-weight="400" fill="#18212e">dimenhydrinate.</tspan></text>
