<path d="M33 704H29V828H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 766.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">INVESTIGATIONS</text>
<path d="M33 868H29V1018H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 943.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">TREATMENT</text>
