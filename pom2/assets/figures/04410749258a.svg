<svg xmlns="http://www.w3.org/2000/svg" width="1068" height="1040" viewBox="0 0 1068 1040" role="img" aria-labelledby="t"><title id="t">Anterior shoulder pain: decide whether it is the long head of the biceps tendon (tendinopathy or a frank tear, diagnosed mostly by examination and treated with active physiotherapy) or a neighbour: rotator cuff tendinopathy or subacromial bursitis (ultrasound), a SLAP labral tear (MR arthrogram), arthritis, or pain referred from the neck or viscera</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
