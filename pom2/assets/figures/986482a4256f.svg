<rect x="288" y="288" width="246" height="572" rx="16" fill="#eff5fc" stroke="#1f5f9e" stroke-opacity="0.25"/>
<rect x="564" y="288" width="246" height="572" rx="16" fill="#f4f7ee" stroke="#4f6d1f" stroke-opacity="0.25"/>
<rect x="812" y="288" width="246" height="572" rx="16" fill="#fdf4ea" stroke="#b5600f" stroke-opacity="0.25"/>
