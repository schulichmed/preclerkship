<svg xmlns="http://www.w3.org/2000/svg" width="1316" height="874" viewBox="0 0 1316 874" role="img" aria-labelledby="t"><title id="t">Nerve injury: after ruling out a tendon or blood-flow cause, localize the lesion (radiculopathy versus mononeuropathy) from the pattern of sensory loss and weakness, then grade it by the Seddon classification (neurapraxia, axonotmesis, neurotmesis), which predicts recovery; electrodiagnostic studies confirm, localize and grade</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
