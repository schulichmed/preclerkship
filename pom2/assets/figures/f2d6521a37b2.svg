<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1140" viewBox="0 0 920 1140" role="img" aria-labelledby="t"><title id="t">Osteoporosis pathway: diagnosis, who gets a bone density scan, who gets drug treatment, and which drug for which fracture site</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<text x="460" y="34" font-family="Georgia, 'DejaVu Serif', serif" font-size="18" font-weight="700" fill="#18212e" text-anchor="middle">Osteoporosis is diagnosed by ANY ONE of these:</text>
<rect x="15" y="56" width="250" height="78" rx="10" fill="#ffffff" stroke="#18212e" stroke-width="2"/>
<text x="140" y="80.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#18212e" text-anchor="middle">Fragility fracture</text>
<text x="140" y="100.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle">not skull, hands, feet, ankles,</text>
<text x="140" y="118.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle">or real trauma</text>
<rect x="335" y="56" width="250" height="78" rx="10" fill="#ffffff" stroke="#18212e" stroke-width="2"/>
<text x="460" y="89.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#18212e" text-anchor="middle">T-score &lt; −2.5</text>
<text x="460" y="109.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle">on a bone density scan</text>
<rect x="655" y="56" width="250" height="78" rx="10" fill="#ffffff" stroke="#18212e" stroke-width="2"/>
<text x="780" y="80.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#18212e" text-anchor="middle">FRAX 10-year risk &gt; 20%</text>
<text x="780" y="100.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle">if no fragility fracture</text>
<text x="780" y="118.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle">and T-score above −2.5</text>
<text x="300" y="102" font-family="Georgia, 'DejaVu Serif', serif" font-size="20" font-weight="700" fill="#18212e" text-anchor="middle">OR</text>
<text x="620" y="102" font-family="Georgia, 'DejaVu Serif', serif" font-size="20" font-weight="700" fill="#18212e" text-anchor="middle">OR</text>
<g transform="translate(0,175)">
<path d="M450 58V88" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M450 152V190" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M610 121H900V472H872" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M270 244H242" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M450 296V330" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M400 376C400 410 145 405 145 438" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M450 376V438" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M500 376C500 410 750 405 750 438" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M450 504V558" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M750 504C750 560 620 584 542 584" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M380 608C380 640 117 635 117 668" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M420 608C420 640 342 640 342 668" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M480 608C480 640 567 640 567 668" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M520 608C520 640 792 635 792 668" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M792 848V872" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<text x="466" y="176" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">no</text>
<text x="755" y="112" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">yes</text>
<text x="256" y="234" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">no</text>
<text x="466" y="318" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">yes</text>
<text x="235" y="630" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">hip</text>
<text x="372" y="645" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">non-vertebral</text>
<text x="528" y="645" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">spine only</text>
<text x="672" y="630" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">build bone</text>
<rect x="270" y="10" width="360" height="48" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="450.0" y="37.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Postmenopausal woman or man ≥ 50</text>
<rect x="290" y="90" width="320" height="62" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="450.0" y="115.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Prior hip or spine fracture,</text>
<text x="450.0" y="135.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">or ≥ 2 fractures?</text>
<rect x="270" y="192" width="360" height="104" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="450.0" y="220.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Bone density scan criteria met?</text>
<text x="450.0" y="240.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">50–64: prior fracture or ≥ 2 risk factors</text>
<text x="450.0" y="258.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">65–69: 1 risk factor</text>
<text x="450.0" y="276.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">≥ 70: everyone</text>
<rect x="20" y="162" width="220" height="164" rx="10" fill="#fbe5e3" stroke="#b3261e" stroke-width="1.5"/>
<text x="130.0" y="184.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b3261e" text-anchor="middle">Lifestyle only</text>
<text x="130.0" y="204.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">everyone gets this too</text>
<text x="130.0" y="222.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">Calcium + vitamin D</text>
<text x="130.0" y="240.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">Weight-bearing exercise</text>
<text x="130.0" y="258.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">Fall prevention: grab bars,</text>
<text x="130.0" y="276.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">no loose rugs or uneven steps,</text>
<text x="130.0" y="294.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">no heavy lifting,</text>
<text x="130.0" y="312.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">no standing on chairs</text>
<rect x="310" y="332" width="280" height="44" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="450.0" y="357.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Bone density scan + FRAX</text>
<rect x="20" y="440" width="250" height="64" rx="10" fill="#fbe5e3" stroke="#b3261e" stroke-width="1.5"/>
<text x="145.0" y="466.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b3261e" text-anchor="middle">No drug</text>
<text x="145.0" y="486.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">risk &lt; 15% or T-score &gt; −2.5</text>
<rect x="320" y="440" width="260" height="64" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="450.0" y="466.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">Suggest drug</text>
<text x="450.0" y="486.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">15–19.9%, or T ≤ −2.5 + age &lt; 70</text>
<rect x="630" y="440" width="240" height="64" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="750.0" y="466.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Recommend drug</text>
<text x="750.0" y="486.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">≥ 20%, or T ≤ −2.5 + age ≥ 70</text>
<rect x="360" y="560" width="180" height="48" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="450.0" y="587.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Which drug?</text>
<rect x="15" y="670" width="205" height="84" rx="10" fill="#e0f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="117.5" y="697.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Bisphosphonate</text>
<text x="117.5" y="717.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">or denosumab</text>
<text x="117.5" y="735.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">or estrogen</text>
<rect x="240" y="670" width="205" height="84" rx="10" fill="#e0f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="342.5" y="697.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Bisphosphonate</text>
<text x="342.5" y="717.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">denosumab, estrogen</text>
<text x="342.5" y="735.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">or teriparatide</text>
<rect x="465" y="670" width="205" height="84" rx="10" fill="#e0f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="567.5" y="706.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Any drug</text>
<text x="567.5" y="726.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">including raloxifene</text>
<rect x="690" y="670" width="215" height="178" rx="10" fill="#eee8f8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="797.5" y="699.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Bone formation therapy</text>
<text x="797.5" y="719.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">teriparatide or romosozumab</text>
<text x="797.5" y="737.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">if any ONE:</text>
<text x="797.5" y="755.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">recent severe vertebral</text>
<text x="797.5" y="773.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">compression fracture</text>
<text x="797.5" y="791.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">&gt; 2 vertebral fractures</text>
<text x="797.5" y="809.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">with T-score &lt; −2.5</text>
<text x="797.5" y="827.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">failure of antiresorptive therapy</text>
<rect x="690" y="874" width="215" height="74" rx="10" fill="#eee8f8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="797.5" y="896.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Then an antiresorptive</text>
<text x="797.5" y="916.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">after romosozumab: 1 yr</text>
<text x="797.5" y="934.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">after teriparatide: 2 yr</text>
<rect x="15" y="782" width="655" height="124" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="31" y="808" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="start">Risk factors</text>
<text x="31" y="832" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Fracture after age 40</text>
<text x="31" y="852" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Glucocorticoids &gt; 3 months (prednisone &gt; 5 mg/day)</text>
<text x="31" y="872" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ≥ 2 falls in the last year</text>
<text x="31" y="892" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Parent with a hip fracture</text>
<text x="391" y="832" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Body mass index &lt; 20</text>
<text x="391" y="852" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Secondary osteoporosis</text>
<text x="391" y="872" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Current smoking</text>
<text x="391" y="892" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Alcohol ≥ 3 drinks/day</text>
</g>
</svg>
