<svg xmlns="http://www.w3.org/2000/svg" width="920" height="642" viewBox="0 0 920 642" role="img" aria-labelledby="t"><title id="t">Postpartum depression screening: PHQ-2 on the antenatal record, EPDS or PHQ-9 if it totals 3 or more, immediate assessment for any self-harm score on EPDS item 10, then by EPDS total</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
