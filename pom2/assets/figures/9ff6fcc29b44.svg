<svg xmlns="http://www.w3.org/2000/svg" width="980" height="642" viewBox="0 0 980 642" role="img" aria-labelledby="t"><title id="t">Approach to amenorrhea: beta-hCG first, then whether a uterus is present, then prolactin and TSH, then serum FSH sorting ovarian, hypothalamic or pituitary, and anovulation causes</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
