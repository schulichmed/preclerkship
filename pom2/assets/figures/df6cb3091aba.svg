<svg xmlns="http://www.w3.org/2000/svg" width="920" height="750" viewBox="0 0 920 750" role="img" aria-labelledby="t"><title id="t">New-onset type 1 diabetes in a child: random glucose and urine dipstick, how many abnormal measurements make the diagnosis, then diabetic ketoacidosis or education and insulin</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M560.0 562.0C560.0 605.0 680.0 605.0 680.0 648.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M360.0 562.0C360.0 605.0 240.0 605.0 240.0 648.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M625.0 442.0C625.0 480.0 560.0 480.0 560.0 518.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M295.0 460.0C295.0 489.0 360.0 489.0 360.0 518.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
