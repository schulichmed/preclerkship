<svg xmlns="http://www.w3.org/2000/svg" width="920" height="972" viewBox="0 0 920 972" role="img" aria-labelledby="t"><title id="t">Puberty: the gonadotropin axis surges before birth, is suppressed by GABA from about 6 months, restarts when kisspeptin rises and the GABA brake lifts, and drives gonadarche, thelarche, the growth spurt and menarche, while adrenarche runs on a separate axis</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
