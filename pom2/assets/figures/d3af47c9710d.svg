<svg xmlns="http://www.w3.org/2000/svg" width="920" height="816" viewBox="0 0 920 816" role="img" aria-labelledby="t"><title id="t">Postpartum hemorrhage management: resuscitate and get help, bimanual exam and fundal massage, look for tears if the uterus is firm or give uterotonic drugs if it is soft, tranexamic acid for both, then escalate if still bleeding</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M460.0 658.0L460.0 714.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M460.0 566.0L460.0 614.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M700.0 462.0C700.0 492.0 510.0 492.0 510.0 522.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M220.0 462.0C220.0 492.0 410.0 492.0 410.0 522.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M520.0 358.0C520.0 388.0 700.0 388.0 700.0 418.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M400.0 358.0C400.0 388.0 220.0 388.0 220.0 418.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M460.0 272.0L460.0 314.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M460.0 168.0L460.0 210.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M460.0 88.0L460.0 124.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<rect x="250.0" y="10.0" width="420.0" height="78.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="460.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Bleeding after birth</text>
<text x="460.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">&gt;500 mL vaginal · &gt;1000 mL cesarean</text>
<text x="460.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">or ANY loss with instability</text>
<rect x="200.0" y="126.0" width="520.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="460.0" y="151.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Airway, breathing, circulation · resuscitate · GET HELP</text>
<rect x="270.0" y="212.0" width="380.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="460.0" y="237.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Bimanual exam + fundal massage</text>
<text x="460.0" y="257.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">empty the bladder</text>
<rect x="345.0" y="316.0" width="230.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="460.0" y="341.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Is the uterus firm?</text>
<rect x="70.0" y="420.0" width="300.0" height="42.0" rx="10" fill="#e0f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="220.0" y="445.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Look for vaginal / cervical tears</text>
<rect x="550.0" y="420.0" width="300.0" height="42.0" rx="10" fill="#eee8f8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="700.0" y="445.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Uterotonic drugs</text>
<rect x="345.0" y="524.0" width="230.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="460.0" y="549.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Tranexamic acid</text>
<rect x="345.0" y="616.0" width="230.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="460.0" y="641.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Still bleeding?</text>
<rect x="160.0" y="716.0" width="600.0" height="78.0" rx="10" fill="#fbe5e3" stroke="#b3261e" stroke-width="1.5"/>
<text x="460.0" y="741.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b3261e" text-anchor="middle">Think DIC · balloon tamponade or packing</text>
<text x="460.0" y="761.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">embolization · compression sutures · artery ligation · hysterectomy</text>
<text x="460.0" y="779.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">GET MORE HELP</text>
<text x="232.0" y="382.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">firm</text>
<text x="722.0" y="382.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">soft (atonic)</text>
<text x="482.0" y="696.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">yes</text>
</svg>
