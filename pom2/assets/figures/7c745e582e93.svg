<svg xmlns="http://www.w3.org/2000/svg" width="920" height="504" viewBox="0 0 920 504" role="img" aria-labelledby="t"><title id="t">Approach to a suspected endocrine problem: a structural problem (a mass) is sorted by benign or malignant and mass effect, a functional problem by excess or deficiency, which decides between a suppression and a stimulation test</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M800.0 380.0L800.0 438.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M580.0 380.0L580.0 438.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M750.0 252.0C750.0 285.0 800.0 285.0 800.0 318.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M630.0 252.0C630.0 285.0 580.0 285.0 580.0 318.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M230.0 342.0L230.0 392.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M230.0 252.0L230.0 298.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M610 112H690V208" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M310 112H230V208" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M460.0 52.0L460.0 86.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<rect x="310.0" y="10.0" width="300.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="460.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Suspected endocrine problem</text>
<rect x="310.0" y="88.0" width="300.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="460.0" y="113.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Structural or functional?</text>
<rect x="80.0" y="210.0" width="300.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="230.0" y="235.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Benign or malignant?</text>
<rect x="10.0" y="300.0" width="440.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="230.0" y="325.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Does the enlargement itself cause clinical effects?</text>
<rect x="20.0" y="394.0" width="420.0" height="78.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="230.0" y="419.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">Mass effect:</text>
<text x="230.0" y="439.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">pituitary → optic chiasm, cranial nerves III/IV/VI, trigeminal V1/V2</text>
<text x="230.0" y="457.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">thyroid → dysphagia</text>
<rect x="540.0" y="210.0" width="300.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="690.0" y="235.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Too much or too little?</text>
<rect x="480.0" y="320.0" width="200.0" height="60.0" rx="10" fill="#e0f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="580.0" y="345.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Try to SUPPRESS it</text>
<text x="580.0" y="365.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">→ suppression test</text>
<rect x="700.0" y="320.0" width="200.0" height="60.0" rx="10" fill="#eee8f8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="800.0" y="345.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Try to STIMULATE it</text>
<text x="800.0" y="365.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">→ stimulation test</text>
<rect x="480.0" y="440.0" width="420.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="690.0" y="465.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Primary, secondary/tertiary, or exogenous source?</text>
<text x="148.0" y="166.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">STRUCTURAL — a mass</text>
<text x="776.0" y="166.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">FUNCTIONAL — hormone</text>
<text x="560.0" y="274.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">EXCESS</text>
<text x="842.0" y="274.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">DEFICIENCY</text>
</svg>
