<svg xmlns="http://www.w3.org/2000/svg" width="980" height="764" viewBox="0 0 980 764" role="img" aria-labelledby="t"><title id="t">Clinical approach to menopause: history, then GSM or VMS, and for VMS whether estrogen is contraindicated, whether she is in the safe-start window, and whether she has a uterus</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
