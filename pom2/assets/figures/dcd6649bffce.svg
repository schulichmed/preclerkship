<svg xmlns="http://www.w3.org/2000/svg" width="834" height="1006" viewBox="0 0 834 1006" role="img" aria-labelledby="t"><title id="t">Suspected hip fracture worked through the lecture's approach: is it a fracture, is the patient stable, why did they fall and why did the bone break, then surgery within 24 to 48 hours chosen by fracture type (femoral neck non-displaced or displaced, intertrochanteric or subtrochanteric), and the after-surgery plan to prevent complications, falls and the next fracture</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<rect x="40" y="560" width="260" height="232" rx="16" fill="#eef7fa" stroke="#1f6f8b" stroke-opacity="0.25"/>
<rect x="302" y="560" width="260" height="232" rx="16" fill="#fcf0f6" stroke="#a3336b" stroke-opacity="0.25"/>
<rect x="564" y="560" width="260" height="232" rx="16" fill="#fdf4ea" stroke="#b5600f" stroke-opacity="0.25"/>
<path d="M33 274H29V370H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 322.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">WORKUP</text>
<path d="M33 688H29V784H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 736.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">TREATMENT</text>
<path d="M33 824H29V984H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 904.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">AFTER SURGERY</text>
<path d="M694.0 488.0L694.0 566.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M694.0 784.0L694.0 822.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
