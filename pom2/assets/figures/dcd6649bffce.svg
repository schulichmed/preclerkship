<path d="M432.0 648.0L432.0 686.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M170.0 488.0L170.0 566.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M170.0 784.0L170.0 822.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M170.0 648.0L170.0 686.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
