<svg xmlns="http://www.w3.org/2000/svg" width="920" height="802" viewBox="0 0 920 802" role="img" aria-labelledby="t"><title id="t">Genetic testing in pregnancy: screening tests give a risk and a positive screen still needs a diagnostic test; diagnostic tests give an answer, and the lab test is chosen by the size of the abnormality.</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
