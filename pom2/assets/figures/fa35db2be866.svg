<path d="M33 798H29V1004H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 901.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">TREATMENT</text>
