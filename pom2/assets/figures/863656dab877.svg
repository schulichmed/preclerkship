<svg xmlns="http://www.w3.org/2000/svg" width="920" height="1098" viewBox="0 0 920 1098" role="img" aria-labelledby="t"><title id="t">Transgender medicine pathway: assessing a young person with gender incongruence, when it is gender dysphoria, and the reversibility ladder from puberty blockers to hormones to surgery</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M460.0 956.0L460.0 996.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M630.0 917.0L650.0 917.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M460.0 842.0L460.0 876.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
