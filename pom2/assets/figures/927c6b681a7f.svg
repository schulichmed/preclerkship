<svg xmlns="http://www.w3.org/2000/svg" width="1124" height="972" viewBox="0 0 1124 972" role="img" aria-labelledby="t"><title id="t">A fall on an outstretched hand: a distal radius fracture is judged on X-ray as crooked, short or not smooth and treated by closed reduction and casting, or surgery when reduction is inadequate; a scaphoid fracture is suspected even with a normal X-ray, cast when undisplaced or distal and operated when displaced or proximal</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<rect x="40" y="406" width="260" height="552" rx="16" fill="#eff5fc" stroke="#1f5f9e" stroke-opacity="0.25"/>
<rect x="302" y="406" width="260" height="552" rx="16" fill="#fdf4ea" stroke="#b5600f" stroke-opacity="0.25"/>
<rect x="592" y="406" width="260" height="552" rx="16" fill="#eef7fa" stroke="#1f6f8b" stroke-opacity="0.25"/>
<rect x="854" y="406" width="260" height="552" rx="16" fill="#fcf0f6" stroke="#a3336b" stroke-opacity="0.25"/>
<path d="M33 238H29V334H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 286.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">WORKUP</text>
<path d="M33 514H29V710H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 612.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">STEPS</text>
<path d="M33 750H29V950H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 850.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">TREATMENT</text>
<path d="M984.0 334.0L984.0 412.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M984.0 710.0L984.0 748.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
