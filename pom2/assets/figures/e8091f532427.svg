<svg xmlns="http://www.w3.org/2000/svg" width="1096" height="1134" viewBox="0 0 1096 1134" role="img" aria-labelledby="t"><title id="t">Rotator cuff disease: pain, weakness and restricted motion; examine active against passive motion, the impingement signs (Neer, Hawkins, painful arc) and cuff strength; then stage it by how far the tendon has gone: stage I (shoulder impingement syndrome) inflamed but intact, stage II partial-thickness and stage III full-thickness defects, and rotator cuff arthropathy with the humerus riding up to the acromion; nonoperative care first at every stage, then surgery by stage when pain persists, the shoulder is weak or it followed an acute injury</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
