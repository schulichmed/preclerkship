<text x="694.0" y="559.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">FULL-thickness defect</text>
<rect x="831.0" y="496.0" width="250.0" height="96.0" rx="10" fill="#a3336b" stroke="#a3336b" stroke-width="1.5"/>
<text x="956.0" y="539.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Rotator cuff arthropathy</text>
<text x="956.0" y="559.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">massive defect in the cuff</text>
