<path d="M460.0 242.0L460.0 278.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M460.0 142.0L460.0 198.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M560 121H740V428" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M360 121H160V428" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M460.0 70.0L460.0 98.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<rect x="210.0" y="10.0" width="500.0" height="60.0" rx="10" fill="#fff4c2" stroke="#c9a227" stroke-width="1.5"/>
<text x="460.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6b5200" text-anchor="middle">Screen at 24–28 weeks gestation</text>
<text x="460.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">1-hour 50g oral glucose tolerance test (OGTT), non-fasting</text>
<rect x="360.0" y="100.0" width="200.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="460.0" y="125.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">1-hour glucose?</text>
<rect x="340.0" y="200.0" width="240.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="460.0" y="225.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Fasting 75g OGTT</text>
<rect x="240.0" y="280.0" width="440.0" height="60.0" rx="10" fill="#fff4c2" stroke="#c9a227" stroke-width="1.5"/>
<text x="460.0" y="305.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6b5200" text-anchor="middle">Any ONE value at or above</text>
<text x="460.0" y="325.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">fasting 5.3 · 1-hour 10.6 · 2-hour 9.0 mmol/L?</text>
<rect x="40.0" y="430.0" width="240.0" height="42.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="160.0" y="455.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">No further testing</text>
<rect x="580.0" y="430.0" width="320.0" height="42.0" rx="10" fill="#fff4c2" stroke="#c9a227" stroke-width="1.5"/>
<text x="740.0" y="455.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6b5200" text-anchor="middle">GDM DIAGNOSED</text>
<rect x="580.0" y="510.0" width="320.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="740.0" y="535.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Lifestyle first, then insulin if needed</text>
<rect x="580.0" y="590.0" width="320.0" height="42.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="740.0" y="615.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Stop treatment after delivery</text>
<rect x="580.0" y="670.0" width="320.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="740.0" y="695.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Re-screen with 75g OGTT</text>
<text x="740.0" y="715.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">at 6 weeks – 6 months postpartum</text>
<text x="255.0" y="112.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">&lt; 7.8 mmol/L — NORMAL</text>
<text x="650.0" y="112.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">≥ 11.1 mmol/L</text>
<text x="530.0" y="177.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">7.8 – 11.0 mmol/L</text>
<text x="365.0" y="398.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">No — all three below</text>
<text x="555.0" y="398.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">Yes — one is enough</text>
</svg>
