<svg xmlns="http://www.w3.org/2000/svg" width="920" height="752" viewBox="0 0 920 752" role="img" aria-labelledby="t"><title id="t">Gestational diabetes pathway: the 1-hour 50g screen at 24–28 weeks, the fasting 75g OGTT for intermediate results, treatment, and the postpartum re-screen</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M740.0 632.0L740.0 668.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M740.0 552.0L740.0 588.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M740.0 472.0L740.0 508.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M560.0 340.0C560.0 384.0 670.0 384.0 670.0 428.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
