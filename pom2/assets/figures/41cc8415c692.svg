<svg xmlns="http://www.w3.org/2000/svg" width="920" height="496" viewBox="0 0 920 496" role="img" aria-labelledby="t"><title id="t">Setting a glycated hemoglobin (A1c) target by risk of hypoglycemia: 6.5% or less for selected type 2 diabetes, 7.0% or less for most, 7.1 to 8.5% for the frail, with what drives the tight and the relaxed targets</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<path d="M762.0 316.0L762.0 358.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M158.0 316.0L158.0 358.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M560.0 130.0C560.0 174.0 762.0 174.0 762.0 218.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M460.0 130.0L460.0 218.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
