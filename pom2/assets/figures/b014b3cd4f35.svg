<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="445" viewBox="0 0 1120 445" role="img" aria-labelledby="t"><title id="t">Parathyroidectomy in primary hyperparathyroidism: operate if symptomatic, or if any one criterion is met - PTH damage to the kidney or to bone, or age under 50</title><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<rect x="346.1" y="24.0" width="427.7" height="40.0" rx="10" fill="#18212e"/>
<text x="560.0" y="49.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="15" font-weight="700" fill="#f6f7f9" text-anchor="middle">Parathyroidectomy if symptomatic, or ANY ONE of:</text>
<line x1="560.0" y1="64.0" x2="560.0" y2="86.0" stroke="#c9d0db" stroke-width="2"/>
<line x1="196.7" y1="86.0" x2="923.3" y2="86.0" stroke="#c9d0db" stroke-width="2"/>
<line x1="196.7" y1="86.0" x2="196.7" y2="108.0" stroke="#c9d0db" stroke-width="2"/>
<line x1="560.0" y1="86.0" x2="560.0" y2="108.0" stroke="#c9d0db" stroke-width="2"/>
<line x1="923.3" y1="86.0" x2="923.3" y2="108.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="24.0" y="108.0" width="345.3" height="66.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="38.0" y="139.1" font-family="Georgia, 'DejaVu Serif', serif" font-size="18" text-anchor="start"><tspan font-weight="700" fill="#a45a12">Stones</tspan></text>
<text x="38.0" y="157.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#18212e">PTH damage to the kidney</tspan></text>
<rect x="52.0" y="184.0" width="317.3" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="64.0" y="209.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Serum calcium &gt; 0.25 mmol/L above</tspan></text>
<text x="64.0" y="229.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">the upper limit</tspan></text>
<line x1="38.0" y1="204.0" x2="52.0" y2="204.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="52.0" y="254.0" width="317.3" height="57.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="64.0" y="279.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">24-hour urine calcium &gt; 10 mmol/day</tspan></text>
<text x="64.0" y="297.1" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" text-anchor="start"><tspan font-weight="400" fill="#5a6577">with increased kidney stone risk</tspan></text>
<line x1="38.0" y1="274.0" x2="52.0" y2="274.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="52.0" y="321.0" width="317.3" height="40.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="64.0" y="346.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Nephrolithiasis or nephrocalcinosis</tspan></text>
<line x1="38.0" y1="341.0" x2="52.0" y2="341.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="52.0" y="371.0" width="317.3" height="40.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="64.0" y="396.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Creatinine clearance &lt; 60 mL/min</tspan></text>
<line x1="38.0" y1="391.0" x2="52.0" y2="391.0" stroke="#c9d0db" stroke-width="2"/>
<line x1="38.0" y1="174.0" x2="38.0" y2="391.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="387.3" y="108.0" width="345.3" height="66.0" rx="10" fill="#eee8f8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="401.3" y="139.1" font-family="Georgia, 'DejaVu Serif', serif" font-size="18" text-anchor="start"><tspan font-weight="700" fill="#6a4aa8">Bones</tspan></text>
<text x="401.3" y="157.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#18212e">PTH damage to bone</tspan></text>
<rect x="415.3" y="184.0" width="317.3" height="74.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="427.3" y="209.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">T-score &lt; −2.5</tspan></text>
<text x="427.3" y="227.1" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" text-anchor="start"><tspan font-weight="400" fill="#5a6577">lumbar spine, femoral neck, total hip or one-third</tspan></text>
<text x="427.3" y="244.1" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" text-anchor="start"><tspan font-weight="400" fill="#5a6577">radius</tspan></text>
<line x1="401.3" y1="204.0" x2="415.3" y2="204.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="415.3" y="268.0" width="317.3" height="40.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="427.3" y="293.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Vertebral fracture</tspan></text>
<line x1="401.3" y1="288.0" x2="415.3" y2="288.0" stroke="#c9d0db" stroke-width="2"/>
<line x1="401.3" y1="174.0" x2="401.3" y2="288.0" stroke="#c9d0db" stroke-width="2"/>
<rect x="750.7" y="108.0" width="345.3" height="66.0" rx="10" fill="#e0f0f5" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="764.7" y="139.1" font-family="Georgia, 'DejaVu Serif', serif" font-size="18" text-anchor="start"><tspan font-weight="700" fill="#1f6f8b">Young</tspan></text>
<text x="764.7" y="157.8" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" text-anchor="start"><tspan font-weight="400" fill="#18212e">age alone is enough</tspan></text>
<rect x="778.7" y="184.0" width="317.3" height="40.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="790.7" y="209.5" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" text-anchor="start"><tspan font-weight="700" fill="#18212e">Age &lt; 50</tspan></text>
<line x1="764.7" y1="204.0" x2="778.7" y2="204.0" stroke="#c9d0db" stroke-width="2"/>
<line x1="764.7" y1="174.0" x2="764.7" y2="204.0" stroke="#c9d0db" stroke-width="2"/>
</svg>
