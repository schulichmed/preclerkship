<svg xmlns="http://www.w3.org/2000/svg" width="1068" height="900" viewBox="0 0 1068 900" role="img" aria-labelledby="t"><title id="t">A child with a limp or hip pain: first exclude a septic hip with the Kocher criteria, then age separates transient synovitis, Legg-Calve-Perthes disease and slipped capital femoral epiphysis; each column gives presentation, investigations and treatment</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
