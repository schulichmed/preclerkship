<details class="orig"><summary>Compare with the chart as it is in the notes</summary><div class="paper"><svg xmlns="http://www.w3.org/2000/svg" width="982" height="1836" viewBox="0 0 982 1836" role="img" aria-labelledby="t"><title id="t">Acute monoarthritis: one hot, red joint for under six weeks is infected until the aspirate says otherwise; the three C's (cell count, culture with Gram stain, crystals) separate septic arthritis from gout (needle-shaped, negatively birefringent urate) and pseudogout (rhomboid, positively birefringent calcium pyrophosphate), each with its own treatment</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>

<rect x="126.0" y="10.0" width="760.0" height="78.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="506.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">ONE hot, red, swollen joint for under 6 weeks: INFECTION until proven otherwise</text>
<text x="506.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">IF THE JOINT IS RED, ASPIRATE IT → the 3 C's: cell count (hours) · culture + Gram stain (24–48 h) · crystals (hours)</text>
<text x="506.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">differential: infection · infection · infection · gout · pseudogout (rarely reactive or psoriatic arthritis)</text>
<rect x="45.0" y="138.0" width="290.0" height="80.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="190.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">NO crystals, organisms seen or</text>
<text x="190.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">grown</text>
<text x="190.0" y="203.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">a MEDICAL EMERGENCY</text>
<rect x="375.0" y="138.0" width="592.0" height="80.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="671.0" y="173.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">CRYSTALS under polarized light</text>
<text x="671.0" y="193.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">both can look exactly like an infected joint, fever included</text>
<rect x="45.0" y="298.0" width="290.0" height="168.0" rx="10" fill="#a3336b" stroke="#a3336b" stroke-width="1.5"/>
<text x="190.0" y="323.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Septic arthritis</text>
<text x="190.0" y="343.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">Staphylococcus 60%+ · streptococcus 20%</text>
<text x="190.0" y="361.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">gram-negatives 15% (immunocompromised,</text>
<text x="190.0" y="379.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">elderly, neonates, intravenous (IV) drug use) ·</text>
<text x="190.0" y="397.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">anaerobes</text>
<text x="190.0" y="415.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">spread: blood (#1) · direct inoculation · nearby</text>
<text x="190.0" y="433.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">infected bone</text>
<text x="190.0" y="451.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">untreated: rapid joint destruction</text>
<rect x="375.0" y="298.0" width="290.0" height="168.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="520.0" y="377.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Gout</text>
<text x="520.0" y="397.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">monosodium urate (uric acid) crystals</text>
<rect x="677.0" y="298.0" width="290.0" height="168.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="822.0" y="377.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Pseudogout</text>
<text x="822.0" y="397.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">calcium pyrophosphate (CPP) crystals</text>
<rect x="45.0" y="506.0" width="290.0" height="150.0" rx="10" fill="#f8e0ec" stroke="#a3336b" stroke-width="1.5"/>
<text x="190.0" y="576.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a3336b" text-anchor="middle">Fever, unwell, can't bear weight</text>
<text x="190.0" y="596.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">red flags: fever · pain · range of motion ↓</text>
<rect x="45.0" y="678.0" width="290.0" height="258.0" rx="10" fill="#ffffff" stroke="#a3336b" stroke-width="1.5"/>
<text x="190.0" y="748.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a3336b" text-anchor="middle">HIGH risk</text>
<text x="55.0" y="768.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• prosthetic joint or recent joint surgery</text>
<text x="55.0" y="786.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• immunosuppressed (diabetes, methotrexate,</text>
<text x="62.8" y="804.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">prednisone, biologics)</text>
<text x="55.0" y="822.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• cancer · leflunomide · recent infection</text>
<text x="55.0" y="840.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• IV drugs, alcohol, very young or old</text>
<text x="55.0" y="858.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• damaged joint (arthritis) · penetrating trauma</text>
<text x="62.8" y="876.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">· skin infection</text>
<rect x="375.0" y="506.0" width="290.0" height="114.0" rx="10" fill="#fbe8d3" stroke="#b5600f" stroke-width="1.5"/>
<text x="520.0" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Peaks in HOURS, exquisitely painful</text>
<text x="385.0" y="551.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• can't stand the bedsheet touching it</text>
<text x="385.0" y="569.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• big toe (1st metatarsophalangeal joint) in</text>
<text x="392.8" y="587.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">50% · usually one lower-limb joint</text>
<text x="385.0" y="605.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• untreated: 7-10 days</text>
<rect x="375.0" y="642.0" width="290.0" height="294.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="520.0" y="667.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Who and why</text>
<text x="385.0" y="687.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• men 35–50 · women after menopause</text>
<text x="385.0" y="705.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• UNDER-excretion of uric acid: the</text>
<text x="392.8" y="723.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">commonest cause</text>
<text x="385.0" y="741.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• diuretics (furosemide, hydrochlorothiazide),</text>
<text x="392.8" y="759.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">alcohol, kidney impairment, family history,</text>
<text x="392.8" y="777.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">male</text>
<text x="385.0" y="795.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• 'disease of plenty': obesity, hypertension,</text>
<text x="392.8" y="813.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">diabetes, high lipids</text>
<text x="385.0" y="831.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• SMARTS: surgery, mechanical injury,</text>
<text x="392.8" y="849.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">alcohol, recent illness, travel or dehydration,</text>
<text x="392.8" y="867.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">starting or stopping allopurinol</text>
<text x="520.0" y="885.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">case: 48 M brewery worker on</text>
<text x="520.0" y="903.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">hydrochlorothiazide, 2 days after</text>
<text x="520.0" y="921.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">cholecystectomy → red big toe · cells 15</text>
<rect x="677.0" y="506.0" width="290.0" height="187.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="822.0" y="584.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Less intense, SLOWER to peak, lasts</text>
<text x="822.0" y="604.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">longer</text>
<text x="822.0" y="624.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">days to a few weeks untreated</text>
<rect x="677.0" y="715.0" width="290.0" height="221.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="822.0" y="793.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Who</text>
<text x="687.0" y="813.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• older people, often with osteoarthritis</text>
<text x="687.0" y="831.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• KNEE most common · one lower-limb joint</text>
<text x="822.0" y="849.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">case: 78 F, knee OA, after a brisk walk: right</text>
<text x="822.0" y="867.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">knee swollen, warm, flexes &lt; 100° · cells 18</text>
<rect x="45.0" y="976.0" width="290.0" height="168.0" rx="10" fill="#f8e0ec" stroke="#a3336b" stroke-width="1.5"/>
<text x="190.0" y="1001.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a3336b" text-anchor="middle">1 · Aspirate: cells HIGH</text>
<text x="55.0" y="1021.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• over 50 000 points to infection</text>
<text x="55.0" y="1039.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Gram stain: e.g. Gram-positive cocci in</text>
<text x="62.8" y="1057.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">clusters</text>
<text x="190.0" y="1075.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">case: 62 M, diabetes, knee replacement,</text>
