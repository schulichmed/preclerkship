<rect x="197.0" y="10.0" width="760.0" height="78.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="577.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Diabetes in pregnancy: was the glucose high BEFORE organogenesis?</text>
<text x="577.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">organogenesis runs weeks 3–16, often before she knows she is pregnant</text>
<text x="577.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">glucose goals for EVERY one: fasting &lt; 5.3 · 1 h after meals &lt; 7.8 mmol/L</text>
<rect x="45.0" y="138.0" width="512.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="301.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">BEFORE conception: type 1 or type 2</text>
<text x="301.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">high glucose in organogenesis → MALFORMATIONS</text>
<rect x="597.0" y="138.0" width="512.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="853.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Found at 24–28 weeks: SCREEN every pregnancy</text>
<text x="853.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">starts AFTER organogenesis → NO malformations</text>
<rect x="597.0" y="238.0" width="512.0" height="96.0" rx="10" fill="#e3edf8" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="853.0" y="263.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Screen in order</text>
<text x="607.0" y="283.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">1 · 50 g glucose, any time of day, 1 h: &lt; 7.8 normal, stop · ≥ 11.1 = gestational</text>
<text x="625.0" y="301.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">diabetes (GDM)</text>
<text x="607.0" y="319.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">2 · 7.8–11.0 → FASTING 75 g test: GDM if ANY of fasting ≥ 5.3, 1 h ≥ 10.6, 2 h ≥ 9.0</text>
<rect x="45.0" y="414.0" width="250.0" height="114.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="170.0" y="439.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Before conception</text>
<text x="170.0" y="459.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">the glycated hemoglobin (A1c) at</text>
<text x="170.0" y="477.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">conception sets the malformation risk</text>
<text x="170.0" y="495.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">1–2% of pregnancies · malformations</text>
<text x="170.0" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">1.7–9.4% (general 2–4%)</text>
<rect x="307.0" y="414.0" width="250.0" height="114.0" rx="10" fill="#1f5f9e" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="432.0" y="457.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Pregnant with type 1 or 2</text>
<text x="432.0" y="477.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">follow closely: endocrinology +</text>
<text x="432.0" y="495.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">obstetrics (timing of delivery)</text>
<rect x="597.0" y="414.0" width="250.0" height="114.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="722.0" y="439.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Gestational diabetes (GDM)</text>
<text x="722.0" y="459.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">weight + placental hormones → insulin</text>
<text x="722.0" y="477.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">resistance</text>
<text x="722.0" y="495.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">common: 16.9% of pregnancies</text>
<text x="722.0" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">worldwide · resolves after delivery</text>
<rect x="859.0" y="414.0" width="250.0" height="114.0" rx="10" fill="#8a5a2b" stroke="#8a5a2b" stroke-width="1.5"/>
<text x="984.0" y="466.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">It was TYPE 2 all along</text>
<text x="984.0" y="486.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">less often early type 1</text>
<rect x="45.0" y="568.0" width="250.0" height="276.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="170.0" y="620.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Malformations</text>
<text x="55.0" y="640.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• neural tube: anencephaly, spina bifida</text>
<text x="62.8" y="658.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">· caudal regression</text>
<text x="55.0" y="676.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• heart: transposition, coarctation,</text>
<text x="62.8" y="694.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">ATRIAL SEPTAL DEFECT, pulmonary</text>
<text x="62.8" y="712.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">stenosis</text>
<text x="55.0" y="730.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• duodenal atresia, imperforate anus,</text>
<text x="62.8" y="748.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">situs inversus</text>
<text x="55.0" y="766.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• renal agenesis, duplex ureters,</text>
<text x="62.8" y="784.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">hydronephrosis</text>
<text x="55.0" y="802.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• mostly IRREVERSIBLE</text>
<rect x="307.0" y="568.0" width="250.0" height="276.0" rx="10" fill="#dde9f7" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="432.0" y="593.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Mother and baby</text>
<text x="317.0" y="613.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• pre-eclampsia ×2 (10% vs 5%): after</text>
<text x="324.8" y="631.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">20 weeks, cure = delivery</text>
<text x="317.0" y="649.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• retinopathy WORSENS: high blood</text>
<text x="324.8" y="667.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">pressure, pre-eclampsia, worse</text>
<text x="324.8" y="685.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">baseline, big A1c drop</text>
<text x="317.0" y="703.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• nephropathy: settles after delivery</text>
<text x="317.0" y="721.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• cesarean 32–45% · born &lt; 34 weeks</text>
<text x="324.8" y="739.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">15% · fetal distress</text>
<text x="317.0" y="757.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• big baby (&gt; 4 kg) or small (vascular</text>
<text x="324.8" y="775.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">disease: poor placental flow)</text>
<text x="317.0" y="793.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• newborn LOW glucose, low calcium,</text>
<text x="324.8" y="811.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">high red cells, bilirubin</text>
<text x="317.0" y="829.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• baby NOT born with diabetes</text>
<rect x="597.0" y="568.0" width="250.0" height="276.0" rx="10" fill="#fbe8d3" stroke="#b5600f" stroke-width="1.5"/>
<text x="722.0" y="665.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Mother and baby</text>
<text x="607.0" y="685.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• baby &gt; 4 kg: shoulder dystocia,</text>
<text x="614.8" y="703.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">brachial plexus injury</text>
<text x="607.0" y="721.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• asphyxia, stillbirth · newborn low</text>
<text x="614.8" y="739.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">glucose, calcium, high bilirubin</text>
<text x="607.0" y="757.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• hypertension, induction, cesarean</text>
<rect x="859.0" y="568.0" width="250.0" height="276.0" rx="10" fill="#f3e6d8" stroke="#8a5a2b" stroke-width="1.5"/>
<text x="984.0" y="692.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#8a5a2b" text-anchor="middle">Hint in pregnancy</text>
<text x="984.0" y="712.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">glucose or insulin doses unusually</text>
<text x="984.0" y="730.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">HIGH</text>
<rect x="45.0" y="884.0" width="250.0" height="79.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="170.0" y="909.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">1 · A1c ≤ 7%</text>
