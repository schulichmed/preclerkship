<details class="orig"><summary>Compare with the chart as it is in the notes</summary><div class="paper"><svg xmlns="http://www.w3.org/2000/svg" width="1324" height="2100" viewBox="0 0 1324 2100" role="img" aria-labelledby="t"><title id="t">Dizziness: first decide whether it is true vertigo; non-vestibular dizziness has organic and psychiatric causes, while peripheral vertigo is named by how long attacks last and whether hearing is affected: BPPV, Meniere's disease, vestibular neuronitis or labyrinthitis, superior canal dehiscence, and aminoglycoside toxicity; the vestibular group box explains how the inner ear signals movement and a shared exam box reads the nystagmus; each column gives presentation, investigations and treatment</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>

<rect x="297.0" y="10.0" width="760.0" height="132.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="677.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">"Dizzy": is it TRUE VERTIGO, an illusion of rotary movement?</text>
<text x="677.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">history is 80% of the workup · exam: nystagmus (named by its FAST phase) and ataxia · CT, MRI</text>
<text x="677.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">balance: vestibular + vision + position sense → brainstem, cerebellum → eye and limb muscles</text>
<text x="677.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">one ear fails → imbalance read as rotation: eye muscles = NYSTAGMUS · higher centres = VERTIGO · limbs = ataxia · vagal</text>
<text x="677.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">nucleus = nausea, vomiting</text>
<text x="677.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">anxiety: often the cause OR the effect · vestibular schwannoma: one-sided hearing loss + tinnitus, rarely vertigo</text>
<rect x="45.0" y="192.0" width="196.0" height="168.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="143.0" y="262.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">NO: dizziness</text>
<text x="143.0" y="282.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">lightheaded, unsteady,</text>
<text x="143.0" y="300.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">disoriented · chronic</text>
<rect x="281.0" y="192.0" width="1028.0" height="168.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="795.0" y="217.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">YES: vestibular</text>
<text x="795.0" y="237.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">episodic, limited duration · hearing symptoms · nausea, vomiting, sweating, bowels · worse with head movement</text>
<text x="291.0" y="255.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• hair cells (CN VIII): bending toward the kinocilium opens K+ channels → depolarizes</text>
<text x="291.0" y="273.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• resting firing ~100/s, so each afferent signals BOTH directions</text>
<text x="291.0" y="291.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• otoliths (utricle, saccule): linear movement, tilt vs gravity · posture</text>
<text x="291.0" y="309.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• canals: rotation · endolymph lags, pushes the cupula · gaze stabilization</text>
<text x="291.0" y="327.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• canals work in PAIRS: the brain reads the difference, so one dead ear = false rotation</text>
<text x="291.0" y="345.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• VOR: 3 neurons, eyes compensate in 10-15 ms</text>
<rect x="281.0" y="400.0" width="1028.0" height="132.0" rx="10" fill="#e3edf8" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="795.0" y="425.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Exam: read the NYSTAGMUS</text>
<text x="291.0" y="445.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• slow phase = vestibulo-ocular reflex · fast phase = saccade that resets the eye</text>
<text x="291.0" y="463.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• PERIPHERAL (spontaneous vestibular): direction FIXED, mostly horizontal, SUPPRESSED by fixation</text>
<text x="291.0" y="481.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• physiologic: rotation · caloric · optokinetic · end-point</text>
<text x="291.0" y="499.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• caloric COWS: Cold → fast phase Opposite, Warm → Same · tests the brainstem in coma (needs the MLF for conjugate eyes)</text>
<text x="291.0" y="517.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• other pathologic: positional · gaze-paretic · rebound · fixation · congenital · dissociated</text>
<rect x="281.0" y="572.0" width="1028.0" height="78.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="795.0" y="597.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">How long does an attack last, and is hearing lost?</text>
<text x="795.0" y="617.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">seconds: BPPV, dehiscence · minutes to hours: Ménière's (hearing lost) or migrainous (hearing kept) · days: labyrinthitis (hearing lost) or neuronitis (kept) · forever:</text>
<text x="795.0" y="635.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">uncompensated vestibular loss</text>
<rect x="45.0" y="730.0" width="196.0" height="150.0" rx="10" fill="#46607a" stroke="#46607a" stroke-width="1.5"/>
<text x="143.0" y="809.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Not vestibular</text>
<rect x="281.0" y="730.0" width="196.0" height="150.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="379.0" y="782.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">BPPV</text>
<text x="379.0" y="802.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">benign paroxysmal positional</text>
<text x="379.0" y="820.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">vertigo · commonest</text>
<text x="379.0" y="838.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">end-organ disorder</text>
<rect x="489.0" y="730.0" width="196.0" height="150.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="587.0" y="781.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Superior canal</text>
<text x="587.0" y="801.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">dehiscence</text>
<text x="587.0" y="821.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">a third mobile window into the</text>
<text x="587.0" y="839.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">inner ear</text>
<rect x="697.0" y="730.0" width="196.0" height="150.0" rx="10" fill="#1f5f9e" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="795.0" y="755.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Ménière's disease</text>
<text x="795.0" y="775.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">endolymphatic hydrops · 2nd</text>
<text x="795.0" y="793.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">commonest</text>
<text x="795.0" y="811.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">50-100 per 100,000 · 10% of</text>
<text x="795.0" y="829.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">dizzy clinic visits</text>
<text x="795.0" y="847.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">onset 40s, then 50s, 30s ·</text>
<text x="795.0" y="865.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">familial &lt; 10%</text>
<rect x="905.0" y="730.0" width="196.0" height="150.0" rx="10" fill="#6a4aa8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="1003.0" y="790.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Vestibular neuronitis /</text>
<text x="1003.0" y="810.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">labyrinthitis</text>
<text x="1003.0" y="830.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">viral, often after a cold</text>
<rect x="1113.0" y="730.0" width="196.0" height="150.0" rx="10" fill="#4f6d1f" stroke="#4f6d1f" stroke-width="1.5"/>
<text x="1211.0" y="800.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Aminoglycoside toxicity</text>
<text x="1211.0" y="820.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">ear drops or injections</text>
<rect x="45.0" y="920.0" width="196.0" height="177.0" rx="10" fill="#e2e8ee" stroke="#46607a" stroke-width="1.5"/>
<text x="143.0" y="949.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#46607a" text-anchor="middle">Organic</text>
<text x="55.0" y="969.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• presyncope, vasodepressor</text>
