<h1>Multiple Sclerosis</h1>

<details class="orig"><summary>Compare with the chart as it is in the notes</summary><div class="paper"><svg xmlns="http://www.w3.org/2000/svg" width="930" height="1402" viewBox="0 0 930 1402" role="img" aria-labelledby="t"><title id="t">Multiple sclerosis: a relapse is new neurological dysfunction lasting 24 hours or more with no other cause; the typical relapses are myelitis, optic neuritis and brainstem or cerebellar syndromes; the diagnosis needs dissemination in space and time on MRI, with CSF oligoclonal bands able to stand in for time, once better explanations are ruled out; treatment is disease-modifying therapy by category plus symptomatic therapy</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>

<rect x="100.0" y="10.0" width="760.0" height="150.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="480.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Could it be MULTIPLE SCLEROSIS (MS)?</text>
<text x="480.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">an immune attack (B and T cells) on central nervous system myelin (oligodendrocytes) → axonal damage, then loss</text>
<text x="480.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">most common disabling neurological disease of young adults in Canada (240 per 100,000) · women 3:1 · age 20-40 · white,</text>
<text x="480.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">Northern European</text>
<text x="480.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">risk: Epstein-Barr virus (EBV, 32-fold: necessary, NOT sufficient) · genes explain 20-30% · adolescent obesity · smoking · diet ·</text>
<text x="480.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">low vitamin D or sunlight · shift work</text>
<text x="480.0" y="145.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">lesions: cortical or juxtacortical · periventricular · brainstem · cerebellum · spinal cord</text>
<rect x="45.0" y="210.0" width="870.0" height="78.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="480.0" y="235.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">A RELAPSE: which kind?</text>
<text x="480.0" y="255.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">NEW neurological symptoms · acute or subacute onset · lasting 24 HOURS or more · no other cause · not a pseudo-relapse</text>
<text x="480.0" y="273.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">other features: sensory disturbances · fatigue · Lhermitte's sign (an electric shock down the back on bending the neck)</text>
<rect x="45.0" y="368.0" width="282.0" height="60.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="186.0" y="393.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Myelitis</text>
<text x="186.0" y="413.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">spinal cord lesion · about 50% at onset</text>
<rect x="339.0" y="368.0" width="282.0" height="60.0" rx="10" fill="#6a4aa8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="480.0" y="393.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Optic neuritis</text>
<text x="480.0" y="413.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">about 25% at onset</text>
<rect x="633.0" y="368.0" width="282.0" height="60.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="774.0" y="393.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Brainstem or cerebellar syndrome</text>
<text x="774.0" y="413.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">about 15% at onset</text>
<rect x="45.0" y="468.0" width="282.0" height="114.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="186.0" y="502.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Below the lesion</text>
<text x="55.0" y="522.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• sensory changes</text>
<text x="55.0" y="540.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• weakness</text>
<text x="55.0" y="558.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• bladder and bowel dysfunction</text>
<rect x="339.0" y="468.0" width="282.0" height="114.0" rx="10" fill="#ebe4f7" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="480.0" y="511.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Vision</text>
<text x="349.0" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• vision loss</text>
<text x="349.0" y="549.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• PAIN with eye movement</text>
<rect x="633.0" y="468.0" width="282.0" height="114.0" rx="10" fill="#fbe8d3" stroke="#b5600f" stroke-width="1.5"/>
<text x="774.0" y="493.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Eyes and balance</text>
<text x="643.0" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• double vision · vertigo</text>
<text x="643.0" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ataxia · slurred speech (dysarthria)</text>
<text x="774.0" y="549.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">case: man in his 20s · vertigo, nausea, some</text>
<text x="774.0" y="567.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">double vision</text>
<rect x="45.0" y="622.0" width="870.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="480.0" y="647.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">MRI is central · lumbar puncture supports</text>
<text x="480.0" y="667.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">2017 McDonald criteria: clinical attacks + MRI or CSF findings, combined</text>
<rect x="45.0" y="704.0" width="430.0" height="96.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="260.0" y="729.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">Disseminated in SPACE</text>
<text x="260.0" y="749.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">lesions in 2 or more typical regions:</text>
<text x="55.0" y="767.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• periventricular · cortical or juxtacortical</text>
<text x="55.0" y="785.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• infratentorial · spinal cord</text>
<rect x="485.0" y="704.0" width="430.0" height="96.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="700.0" y="729.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">Disseminated in TIME</text>
<text x="495.0" y="749.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• a NEW lesion on follow-up MRI</text>
<text x="495.0" y="767.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• OR enhancing + non-enhancing lesions at once</text>
<text x="495.0" y="785.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• CSF oligoclonal bands can stand in for time</text>
<rect x="45.0" y="822.0" width="870.0" height="60.0" rx="10" fill="#fbe5e3" stroke="#b3261e" stroke-width="1.5"/>
<text x="480.0" y="847.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b3261e" text-anchor="middle">ALWAYS rule out a better explanation</text>
<text x="480.0" y="867.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">neuromyelitis optica (NMO) · myelin oligodendrocyte glycoprotein disease (MOGAD) · vascular · infection · metabolic (B12)</text>
<rect x="45.0" y="922.0" width="870.0" height="98.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="480.0" y="947.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Course: clinically isolated syndrome → relapsing-remitting (85% at onset) → secondary progressive · or primary</text>
<text x="480.0" y="967.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">progressive from the start</text>
<text x="480.0" y="987.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">each labelled active or not, progressing or not · score disability on the Expanded Disability Status Scale (EDSS, 0-10)</text>
<text x="480.0" y="1005.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">prognosis: 50% minor disability at 6-8 y · 21% need a walking aid at 15 y · median 27.9 y (age 59) to need one</text>
<rect x="45.0" y="1042.0" width="430.0" height="168.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="260.0" y="1067.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Disease-modifying therapy: think in CATEGORIES</text>
<text x="55.0" y="1087.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• injectable platforms: interferons, glatiramer (Copaxone) · long-term</text>
<text x="62.8" y="1105.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">safety data, LOW adherence</text>
<text x="55.0" y="1123.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• standard orals: dimethyl fumarate, teriflunomide, fingolimod · easier</text>
<text x="62.8" y="1141.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">than injections</text>
<text x="55.0" y="1159.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• induction: cladribine · oral, effect lasts ~4 y</text>
<text x="55.0" y="1177.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• high efficacy: natalizumab, B-cell therapies (ocrelizumab,</text>
<text x="62.8" y="1195.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">ofatumumab, rituximab) · B-cell therapies now very common</text>
<rect x="485.0" y="1042.0" width="430.0" height="168.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="700.0" y="1085.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Treat the symptoms too</text>
<text x="495.0" y="1105.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• spasticity: baclofen, tizanidine, stretching, physiotherapy</text>
<text x="495.0" y="1123.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• pain, tingling: amitriptyline, gabapentin, duloxetine, CBD</text>
<text x="495.0" y="1141.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• bladder: solifenacin, urology referral · erections: sildenafil</text>
<text x="495.0" y="1159.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• depression: antidepressants</text>
<text x="495.0" y="1177.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• fatigue: amantadine, modafinil · walking: fampridine</text>
<rect x="45.0" y="1244.0" width="870.0" height="136.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="61.0" y="1270.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="start">Differential: VITAMIN</text>
<text x="61.0" y="1294.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• V vascular: migraine, stroke, CADASIL · I infection: HIV, syphilis, Lyme, West Nile</text>
<text x="61.0" y="1314.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• T toxins: cocaine, additives · A autoimmune: NMO, MOG · Sjögren's, Behçet's</text>
<text x="61.0" y="1334.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• M metabolic: B12 · I inflammatory: sarcoid · N neoplastic: lymphoma</text>
<text x="61.0" y="1354.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• top differential, how common: MS 1500 · NMOSD 30 · MOGAD 30 · sarcoid 15 · lymphoma 6 · ADEM 3 · Sjögren's 2</text>
