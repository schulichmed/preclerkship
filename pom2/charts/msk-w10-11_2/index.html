<rect x="197.0" y="10.0" width="760.0" height="132.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="577.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">A soft tissue lump: could it be a SARCOMA? Decide BEFORE anyone cuts it out</text>
<text x="577.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">benign tumours are 100 times more common (300 vs 2 per 100 000) · a sarcoma shelled out like a benign lump, with little or no</text>
<text x="577.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">margin, is the 'WHOOPS': less chance of cure, possible amputation</text>
<text x="577.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">history: has it GROWN? first noticed when, how big then and now (be persistent: fruit, nuts) · trauma · pain or numbness</text>
<text x="577.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">(sarcoma usually painless; big symptoms → metastases) · recurrence · other lumps · family history</text>
<text x="577.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">exam: location, size, skin · superficial (subcutaneous) or DEEP (muscle) · mobile, tethered or FIXED · nodes rarely involved</text>
<rect x="45.0" y="192.0" width="250.0" height="98.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="170.0" y="217.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Under 5 cm, NO suspicious</text>
<text x="170.0" y="237.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">feature</text>
<text x="170.0" y="257.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">limited growth · minimal symptoms ·</text>
<text x="170.0" y="275.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">superficial</text>
<rect x="335.0" y="192.0" width="774.0" height="98.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="722.0" y="236.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Over 5 cm, OR under 5 cm with ANY suspicious feature</text>
<text x="722.0" y="256.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">rapid growth · pain · recurrent · deep · fixed · difficult location</text>
<rect x="335.0" y="330.0" width="774.0" height="78.0" rx="10" fill="#e3edf8" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="722.0" y="355.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">IMAGE before biopsy</text>
<text x="722.0" y="375.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">MRI preferred · CT · rarely ultrasound · or a surgical expert</text>
<text x="722.0" y="393.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">then CORE biopsy by someone experienced in sarcoma · NOT fine needle aspiration</text>
<rect x="45.0" y="488.0" width="250.0" height="132.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="170.0" y="540.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Low risk</text>
<text x="170.0" y="560.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">limited growth, minimal symptoms,</text>
<text x="170.0" y="578.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">superficial</text>
<rect x="335.0" y="488.0" width="250.0" height="132.0" rx="10" fill="#4f6d1f" stroke="#4f6d1f" stroke-width="1.5"/>
<text x="460.0" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Benign on biopsy</text>
<text x="460.0" y="533.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">e.g. spindle cell/pleomorphic lipoma</text>
<text x="460.0" y="551.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">case: 33 M, 17 cm flank mass for 6</text>
<text x="460.0" y="569.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">years, mobile, subcutaneous, many</text>
<text x="460.0" y="587.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">lipomas, uncle too · ultrasound:</text>
<text x="460.0" y="605.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">probable lipoma → MRI</text>
<rect x="597.0" y="488.0" width="250.0" height="132.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="722.0" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Sarcoma, resectable</text>
<text x="722.0" y="551.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">usually a PAINLESS lump</text>
<text x="722.0" y="569.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">curable by surgery + radiation:</text>
<text x="722.0" y="587.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">leiomyosarcoma, liposarcoma</text>
<rect x="859.0" y="488.0" width="250.0" height="132.0" rx="10" fill="#46607a" stroke="#46607a" stroke-width="1.5"/>
<text x="984.0" y="549.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Not curable</text>
<text x="984.0" y="569.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">e.g. lung metastases, non-resectable</text>
<rect x="45.0" y="660.0" width="250.0" height="162.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="170.0" y="718.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Excisional biopsy is acceptable</text>
<text x="170.0" y="738.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">complete removal with minimal</text>
<text x="170.0" y="756.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">surrounding tissue</text>
<text x="170.0" y="774.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">NOT ideal if it is a sarcoma</text>
<rect x="335.0" y="660.0" width="250.0" height="162.0" rx="10" fill="#ffffff" stroke="#4f6d1f" stroke-width="1.5"/>
<text x="460.0" y="709.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#4f6d1f" text-anchor="middle">Lipoma or liposarcoma?</text>
<text x="460.0" y="729.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">vs well-differentiated liposarcoma</text>
<text x="460.0" y="747.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">(atypical lipomatous tumour)</text>
<text x="460.0" y="765.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">immunohistochemistry: MDM2</text>
<text x="460.0" y="783.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">negative, CD34 positive → lipoma</text>
<rect x="597.0" y="660.0" width="250.0" height="60.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="722.0" y="685.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">1 · Stage: CT chest</text>
<text x="722.0" y="705.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">the lung is where it spreads</text>
<rect x="597.0" y="742.0" width="250.0" height="80.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="722.0" y="767.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">2 · Multidisciplinary tumour</text>
<text x="722.0" y="787.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">board</text>
<text x="722.0" y="807.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">every possible sarcoma</text>
<rect x="859.0" y="660.0" width="250.0" height="162.0" rx="10" fill="#ffffff" stroke="#46607a" stroke-width="1.5"/>
<text x="984.0" y="727.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#46607a" text-anchor="middle">Medical oncology</text>
<text x="984.0" y="747.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">no standard chemotherapy · goals of</text>
<text x="984.0" y="765.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">care · clinical trials</text>
<rect x="45.0" y="862.0" width="250.0" height="442.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="170.0" y="1087.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Excise</text>
<rect x="335.0" y="862.0" width="250.0" height="442.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="460.0" y="1087.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Observe</text>
<rect x="597.0" y="862.0" width="250.0" height="96.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="722.0" y="887.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Surgery: WIDE resection</text>
<text x="722.0" y="907.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">a marginal resection is the 'whoops'</text>
<text x="722.0" y="925.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">wide = 1-2 cm (rare) · close or positive</text>
<text x="722.0" y="943.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">margin common → radiation</text>
<rect x="597.0" y="980.0" width="250.0" height="170.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="722.0" y="1005.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">± Radiation, mostly</text>
<text x="722.0" y="1025.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">PRE-operative</text>
<text x="607.0" y="1045.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• local recurrence 30% → 10%</text>
<text x="607.0" y="1063.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• pre-op: better long-term function: only</text>
<text x="614.8" y="1081.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">the tumour radiated, surgery removes</text>
<text x="614.8" y="1099.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">the radiated tissue</text>
<text x="607.0" y="1117.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• case: radiation 6 weeks → surgery</text>
<text x="614.8" y="1135.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">6-8 weeks later</text>
<rect x="597.0" y="1172.0" width="250.0" height="132.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="722.0" y="1197.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">± Chemotherapy: uncommon</text>
<text x="607.0" y="1217.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• NOT standard after surgery (no</text>
<text x="614.8" y="1235.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">survival gain) · select subtypes, trials</text>
