<text x="647.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Headache · coma · new neurological deficit · trauma: the cause is PRESSURE</text>
<text x="647.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">examine to LOCALIZE: Glasgow Coma Scale (GCS), PUPILS, cranial nerves, pronator drift, power side to side, sensory level</text>
<text x="647.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">"GCS 15, moving x 4" can hide 1/5 hand intrinsics + 0/5 legs = T1 cord injury · E1 V3 M5, right arm weaker, ICP 20 = brain</text>
<text x="647.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">injury</text>
<text x="647.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">INTUBATE for GCS &lt; 9 (airway protection) → image → emergency neurosurgery = DECOMPRESSION</text>
