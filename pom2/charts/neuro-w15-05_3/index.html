<rect x="186.0" y="10.0" width="760.0" height="222.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="566.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Child seizing: ABCDE + time it</text>
<text x="566.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">Airway: bag-mask, laryngeal mask or tube if needed · Circulation: early fast pulse, high BP tolerated, LOW BP → fluid bolus</text>
<text x="566.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">Disability: pupils (dilated or pinpoint → overdose · blown or fixed → raised pressure, bleed) · glucose · Exposure: safe space,</text>
<text x="566.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">skin</text>
<text x="566.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">EVERY child: bedside GLUCOSE + blood GAS with electrolytes</text>
<text x="566.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">history: onset, timing, duration · movements, eyes, focal or generalized · consciousness during and after, recovery · fever,</text>
<text x="566.0" y="145.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">trauma, toxins, drugs or withdrawal · milestones, family epilepsy</text>
<text x="566.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">exam: vitals · pupils, cranial nerves, tone, reflexes, focal deficits · raised pressure (bulging fontanelle, papilledema) · café au</text>
<text x="566.0" y="181.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">lait spots (neurofibromatosis)</text>
<text x="566.0" y="199.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">subtle in newborns: lip smacking, sucking, chewing, eye deviation or fluttering, bicycling, apnea, vital sign changes ·</text>
<text x="566.0" y="217.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">subclinical: EEG only</text>
<rect x="45.0" y="282.0" width="672.0" height="78.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="381.0" y="307.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">FEVER, age 6 months-5 years: FEBRILE seizure</text>
<text x="381.0" y="327.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">only if NO CNS infection, NO acute electrolyte problem, NO past afebrile seizure</text>
<text x="381.0" y="345.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">WORRY: not back to baseline · meningeal signs or toxic look · delay or neurologic condition</text>
<rect x="757.0" y="282.0" width="330.0" height="78.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="922.0" y="316.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Still seizing at 5 MINUTES</text>
<text x="922.0" y="336.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">or no return to baseline between seizures</text>
<rect x="45.0" y="440.0" width="330.0" height="78.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="210.0" y="483.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Simple febrile seizure</text>
<rect x="387.0" y="440.0" width="330.0" height="78.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="552.0" y="483.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Complex febrile seizure</text>
<rect x="757.0" y="440.0" width="330.0" height="78.0" rx="10" fill="#a3336b" stroke="#a3336b" stroke-width="1.5"/>
<text x="922.0" y="465.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Convulsive status epilepticus</text>
<text x="922.0" y="485.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">&gt; 30 min, or 2+ seizures without recovery</text>
<text x="922.0" y="503.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">10-73 per 100,000 children a year · most under 2</text>
<rect x="45.0" y="558.0" width="330.0" height="123.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="210.0" y="587.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Typical</text>
<text x="55.0" y="607.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• GENERALIZED</text>
<text x="55.0" y="625.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• &lt; 15 minutes</text>
<text x="55.0" y="643.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ONCE in 24 hours</text>
<text x="55.0" y="661.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• no neurologic or developmental problem</text>
<rect x="45.0" y="703.0" width="330.0" height="87.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="210.0" y="732.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">case: 15 months</text>
<text x="210.0" y="752.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">fever · generalized tonic-clonic 3 min · now alert,</text>
<text x="210.0" y="770.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">playful</text>
<rect x="387.0" y="558.0" width="330.0" height="132.0" rx="10" fill="#fbe8d3" stroke="#b5600f" stroke-width="1.5"/>
<text x="552.0" y="583.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Any ONE of</text>
<text x="397.0" y="603.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• FOCAL (one limb or side)</text>
<text x="397.0" y="621.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• &gt; 15 minutes</text>
<text x="397.0" y="639.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• RECURS within 24 hours</text>
<text x="397.0" y="657.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• focal signs after the seizure</text>
<text x="397.0" y="675.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• known neurologic condition</text>
<rect x="387.0" y="712.0" width="330.0" height="78.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="552.0" y="737.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">case: 14 months, 38.8°C, cold</text>
<text x="552.0" y="757.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">2 right-sided seizures (4 min) in one day · now</text>
<text x="552.0" y="775.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">normal</text>
<rect x="757.0" y="558.0" width="330.0" height="96.0" rx="10" fill="#f8e0ec" stroke="#a3336b" stroke-width="1.5"/>
<text x="922.0" y="583.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a3336b" text-anchor="middle">Tonic-clonic, not stopping</text>
<text x="767.0" y="603.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• most seizures stop within 5 minutes</text>
<text x="767.0" y="621.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• longer = ↑ brain oxygen demand, cell death: time</text>
<text x="774.8" y="639.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">matters</text>
<rect x="757.0" y="676.0" width="330.0" height="114.0" rx="10" fill="#ffffff" stroke="#a3336b" stroke-width="1.5"/>
<text x="922.0" y="701.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a3336b" text-anchor="middle">cases</text>
<text x="767.0" y="721.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• 3, no past seizures, convulsing 10 min → status</text>
<text x="767.0" y="739.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• 2-day newborn: lip smacking, eye deviation, apnea,</text>
<text x="774.8" y="757.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">not stopped by 2 lorazepam, glucose normal →</text>
<text x="774.8" y="775.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">PHENOBARBITAL</text>
<rect x="45.0" y="830.0" width="330.0" height="150.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="210.0" y="900.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Often NO further workup</text>
<text x="210.0" y="920.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">if back to baseline, no other concern</text>
<rect x="387.0" y="830.0" width="330.0" height="150.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="552.0" y="891.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Observe or admit</text>
<text x="552.0" y="911.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">by time back to baseline, neurologic signs, family</text>
<text x="552.0" y="929.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">comfort</text>
<rect x="757.0" y="830.0" width="330.0" height="150.0" rx="10" fill="#ffffff" stroke="#a3336b" stroke-width="1.5"/>
<text x="922.0" y="855.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a3336b" text-anchor="middle">Stepwise, by the differential</text>
<text x="767.0" y="875.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• calcium, magnesium, drug levels</text>
