<rect x="557.0" y="10.0" width="660.0" height="78.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="887.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Calcium problem: CORRECT for albumin, then ALWAYS send a PTH</text>
<text x="887.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">corrected Ca = measured Ca + 0.02 × (40 − albumin)</text>
<text x="887.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">normal total 2.15–2.55 mmol/L · ionized 1.1–1.3 (50%), protein-bound 40%, complexed 10%</text>
<rect x="45.0" y="138.0" width="822.0" height="78.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="456.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">HIGH calcium: corrected &gt; 2.55 mmol/L</text>
<text x="456.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">&gt; 90% is hyperparathyroidism or malignancy · then PTH sorts it</text>
<text x="456.0" y="201.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">symptoms depend on the level and how fast it rose</text>
<rect x="907.0" y="138.0" width="822.0" height="78.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="1318.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">LOW calcium</text>
<text x="1318.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">PTH and PHOSPHATE sort it</text>
<text x="1318.0" y="201.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">rarely, acute complexation of calcium</text>
<rect x="45.0" y="256.0" width="822.0" height="114.0" rx="10" fill="#e3edf8" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="456.0" y="281.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Presents as: often ASYMPTOMATIC · stones, bones, groans, psychiatric overtones</text>
<text x="456.0" y="301.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">GI: abdominal distress, pancreatitis, constipation, vomiting, anorexia</text>
<text x="456.0" y="319.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">renal: POLYURIA (nephrogenic diabetes insipidus), stones, renal insufficiency</text>
<text x="456.0" y="337.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">bone: pain, cystic lesions, demineralisation, spontaneous fractures</text>
<text x="456.0" y="355.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">heart: SHORT QT, arrhythmias, hypertension · brain: confusion, personality change, depression, apathy</text>
<rect x="907.0" y="256.0" width="822.0" height="114.0" rx="10" fill="#e3edf8" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="1318.0" y="281.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Presents as</text>
<text x="1318.0" y="301.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">acute, severe: TETANY — perioral paraesthesias, carpopedal spasm, laryngeal spasm, seizures, palpitations</text>
<text x="1318.0" y="319.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">acute, mild: CHVOSTEK's and TROUSSEAU's signs · heart: PROLONGED QT</text>
<text x="1318.0" y="337.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">chronic: emotional instability, anxiety, brain fog, paraesthesias · cataracts, dry skin, brittle nails</text>
<text x="1318.0" y="355.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">over-treatment: movement disorders, kidney stones</text>
<rect x="45.0" y="450.0" width="266.0" height="114.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="178.0" y="475.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Primary hyperparathyroidism</text>
<text x="178.0" y="495.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">PTH-MEDIATED · PTH ↑ or</text>
<text x="178.0" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">inappropriately normal</text>
<text x="178.0" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">phosphate ↓ (PTH makes the kidney</text>
<text x="178.0" y="549.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">waste it)</text>
<rect x="323.0" y="450.0" width="266.0" height="114.0" rx="10" fill="#a3336b" stroke="#a3336b" stroke-width="1.5"/>
<text x="456.0" y="493.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Hypercalcaemia of malignancy</text>
<text x="456.0" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">PTH-INDEPENDENT · PTH suppressed</text>
<text x="456.0" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">with hyperparathyroidism, &gt; 90% of cases</text>
<rect x="601.0" y="450.0" width="266.0" height="114.0" rx="10" fill="#8a5a2b" stroke="#8a5a2b" stroke-width="1.5"/>
<text x="734.0" y="493.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Vitamin D and other causes</text>
<text x="734.0" y="513.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">PTH-INDEPENDENT · PTH suppressed</text>
<text x="734.0" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">minor causes, &lt; 10%</text>
<rect x="907.0" y="450.0" width="266.0" height="114.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
