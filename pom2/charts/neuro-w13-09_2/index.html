<rect x="402.0" y="10.0" width="760.0" height="132.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="782.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">WEAKNESS: loss of voluntary movement from a break anywhere, cerebrum to muscle fibre</text>
<text x="782.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">first rule out mimics: incoordination (cerebellar) · apraxia (cortical) · severe sensory loss (proprioceptive failure)</text>
<text x="782.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">history: where (one limb, one side, both) · how (abrupt or gradual) · what is hard · sensory, speech or swallowing, pain, bowel</text>
<text x="782.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">or bladder</text>
<text x="782.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">key clues: UMN vs LMN · associated signs · the PATTERN of weakness · exam: catch mild + side-to-side differences</text>
<text x="782.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">power (MRC): 0 none · 1 flicker · 2 gravity eliminated · 3 full ANTIGRAVITY · 4 some resistance (4-, 4, 4+) · 5 full</text>
<rect x="45.0" y="192.0" width="474.0" height="150.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="282.0" y="217.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">UPPER MOTOR NEURON (UMN)</text>
<text x="55.0" y="237.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• corticospinal tract cut: reflexes no longer suppressed</text>
<text x="55.0" y="255.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• spasticity · hyperreflexia</text>
<text x="55.0" y="273.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• upgoing plantar (Babinski)</text>
<text x="55.0" y="291.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• no atrophy · no fasciculations</text>
<text x="55.0" y="309.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• PYRAMIDAL: arm extensors and leg flexors weak first</text>
<text x="55.0" y="327.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• e.g. triceps &lt; biceps · dorsiflexion &lt; plantar flexion</text>
<rect x="559.0" y="192.0" width="960.0" height="150.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="1039.0" y="235.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">LOWER MOTOR NEURON (LMN)</text>
<text x="569.0" y="255.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• atrophy: nerve no longer brings neurotrophic factors</text>
<text x="569.0" y="273.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• fasciculations possible (anterior horn cell, nerve): a motor unit fires on its own</text>
<text x="569.0" y="291.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• reflexes normal, ↓ or absent · tone normal · downgoing plantar</text>
<text x="569.0" y="309.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• the pattern fits the level</text>
