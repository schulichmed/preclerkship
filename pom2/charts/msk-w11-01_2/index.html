<text x="677.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Hand, joint, bone or diabetic foot: HOW DEEP is it, and does it need a knife as well as antibiotics?</text>
