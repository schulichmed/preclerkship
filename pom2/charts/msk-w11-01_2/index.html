<rect x="297.0" y="10.0" width="760.0" height="168.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="677.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Hand, joint, bone or diabetic foot: HOW DEEP is it, and does it need a knife as well as antibiotics?</text>
<text x="677.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">antibiotics alone will NOT save you: pus in a closed space, a joint or dead bone needs drainage or debridement</text>
<text x="677.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">one hot joint: red flags FEVER · pain · much less range of motion · risk: immune compromise, type 2 diabetes, alcohol, age &gt;</text>
<text x="677.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">80, injection drug use, rheumatoid arthritis</text>
<text x="677.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">septic arthritis (S. aureus, group A strep; gram negatives rare): blood count, electrolytes, creatinine, CRP, blood cultures,</text>
<text x="677.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">ASPIRATE (cells &gt; 20 000-50 000, Gram stain) ± imaging</text>
<text x="677.0" y="145.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">surgical washout (decompress, irrigate, debride, save the synovium) + cefazolin 2 g IV q8h, or vancomycin 15 mg/kg +</text>
<text x="677.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">ceftriaxone 2 g IV q24h · S. aureus 4-6 weeks</text>
<rect x="45.0" y="228.0" width="476.0" height="80.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="283.0" y="263.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">HAND: superficial or deep?</text>
<text x="283.0" y="283.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">rest and elevation for both</text>

<text x="677.0" y="293.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">exposure history steers the tests</text>

<text x="1071.0" y="283.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">blood supply, chronicity and debridement decide cure</text>

<text x="949.0" y="433.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">blood-borne: spine, children</text>
<text x="949.0" y="451.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">contiguous: diabetic foot, trauma,</text>

<text x="949.0" y="487.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">biofilm, survives inside osteoblasts ·</text>
<text x="949.0" y="505.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">chronic: NECROTIC bone</text>

<text x="161.0" y="756.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">IRREGULAR margins · superficial</text>
