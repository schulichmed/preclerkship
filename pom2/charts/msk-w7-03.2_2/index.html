<rect x="471.0" y="10.0" width="760.0" height="78.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="851.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Back or neck pain that is NOT just mechanical: where is the problem?</text>
<text x="851.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">OLDCARS + red flags every time · first exclude non-spinal causes: hip, visceral, vascular, systemic, viral</text>
<text x="851.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">nerve compression can come from ANYTHING: disc, spondylosis, abscess, tumour, bleed, slipped vertebra</text>
<rect x="45.0" y="138.0" width="212.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="151.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">To the SIDE: a ROOT</text>
<text x="151.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">in or around the neural foramen</text>
<rect x="297.0" y="138.0" width="660.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="627.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">In the CENTRE: canal stenosis</text>
<text x="627.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">the cord ends at ~L1: lumbar stenosis squeezes ROOTS, cervical squeezes the CORD</text>
<rect x="997.0" y="138.0" width="660.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="1327.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">EVERYTHING ELSE: found by red flags</text>
<text x="1327.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">red flag → plain films for fracture · MRI for neurological compromise, infection, neoplasm</text>
<rect x="45.0" y="278.0" width="212.0" height="114.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="151.0" y="321.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Radiculopathy</text>
<text x="151.0" y="341.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">degenerative (disc, spondylosis)</text>
<text x="151.0" y="359.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">by far the commonest</text>
<rect x="297.0" y="278.0" width="212.0" height="114.0" rx="10" fill="#1f5f9e" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="403.0" y="330.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Lumbar central stenosis</text>
<text x="403.0" y="350.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">squeezes ROOTS</text>
<rect x="521.0" y="278.0" width="212.0" height="114.0" rx="10" fill="#a3336b" stroke="#a3336b" stroke-width="1.5"/>
<text x="627.0" y="321.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Cauda equina syndrome</text>
<text x="627.0" y="341.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">the severe end of lumbar</text>
<text x="627.0" y="359.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">stenosis</text>
<rect x="745.0" y="278.0" width="212.0" height="114.0" rx="10" fill="#6a4aa8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="851.0" y="321.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Cervical myelopathy</text>
<text x="851.0" y="341.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">central stenosis squeezes the</text>
<text x="851.0" y="359.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">CORD</text>
<rect x="997.0" y="278.0" width="212.0" height="114.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="1103.0" y="303.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Inflammatory</text>
<text x="1103.0" y="323.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">seronegative</text>
<text x="1103.0" y="341.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">spondyloarthropathy: ankylosing</text>
<text x="1103.0" y="359.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">spondylitis, psoriatic, IBD,</text>
<text x="1103.0" y="377.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">reactive</text>
<rect x="1221.0" y="278.0" width="212.0" height="114.0" rx="10" fill="#8a5a2b" stroke="#8a5a2b" stroke-width="1.5"/>
<text x="1327.0" y="321.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Fracture</text>
<text x="1327.0" y="341.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">fall or trauma · osteoporosis ·</text>
<text x="1327.0" y="359.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">past fragility fracture</text>
<rect x="1445.0" y="278.0" width="212.0" height="114.0" rx="10" fill="#46607a" stroke="#46607a" stroke-width="1.5"/>
<text x="1551.0" y="312.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Infection · Neoplasm</text>
<text x="1551.0" y="332.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">osteomyelitis, discitis, epidural</text>
<text x="1551.0" y="350.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">abscess · bone tumour, mass,</text>
<text x="1551.0" y="368.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">drop metastases</text>
<rect x="45.0" y="432.0" width="212.0" height="160.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="151.0" y="461.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Limb &gt; neck or back,</text>
<text x="151.0" y="481.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">dermatomal</text>
<text x="55.0" y="501.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• burning, tingling, electrical</text>
<text x="55.0" y="519.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• EASED by slackening the</text>
<text x="62.8" y="537.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">nerve: arm overhead, legs</text>
<text x="62.8" y="555.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">curled</text>
<text x="55.0" y="573.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• myotomal weakness, ↓ reflex</text>
<rect x="45.0" y="614.0" width="212.0" height="106.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="151.0" y="643.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">The disc hits the LOWER</text>
<text x="151.0" y="663.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">root</text>
<text x="55.0" y="683.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• C4/5 → C5 · L4/5 → L5</text>
<text x="55.0" y="701.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• commonest: L5, S1 · C7, C6</text>
<rect x="297.0" y="432.0" width="212.0" height="177.0" rx="10" fill="#dde9f7" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="403.0" y="470.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Legs &gt; back, distal worse</text>
<text x="307.0" y="490.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• NEUROGENIC</text>
<text x="314.8" y="508.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">CLAUDICATION: worse</text>
<text x="314.8" y="526.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">walking a distance</text>
<text x="307.0" y="544.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• eased by flexion: grocery cart,</text>
<text x="314.8" y="562.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">uphill, sitting (slower than</text>
<text x="314.8" y="580.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">vascular)</text>
<rect x="297.0" y="631.0" width="212.0" height="89.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
