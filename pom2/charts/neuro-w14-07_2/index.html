<rect x="323.0" y="10.0" width="760.0" height="132.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="703.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Not responding: FIRST look for the TREATABLE causes</text>
<text x="703.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">shock or low blood pressure · low glucose · diabetic ketoacidosis · hypertensive encephalopathy · drug intoxication</text>
<text x="703.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">bacterial or fungal meningitis · herpes simplex encephalitis · brain abscess · epidural or subdural hematoma</text>
<text x="703.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">also consider: syncope · seizure, post-ictal state · encephalopathy, delirium</text>
<text x="703.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">then EXAMINE: is the patient AWAKE (alertness = VOLUME) and AWARE (awareness = TUNING, the cortex)?</text>
<text x="703.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">alertness: ascending reticular activating system, upper pons + midbrain → thalamus, hypothalamus → cortex</text>
<rect x="45.0" y="192.0" width="624.0" height="80.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="357.0" y="227.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">NOT aware</text>
<text x="357.0" y="247.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">brainstem reflexes and eye opening decide</text>
<rect x="709.0" y="192.0" width="412.0" height="80.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="915.0" y="227.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">SOME awareness: minimally conscious</text>
<text x="915.0" y="247.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">does the patient FOLLOW COMMANDS?</text>

<text x="1261.0" y="237.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">show it</text>
<text x="1261.0" y="257.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">a COMA MIMIC</text>
<rect x="45.0" y="312.0" width="624.0" height="132.0" rx="10" fill="#e3edf8" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="357.0" y="337.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Brainstem reflexes: in → out</text>
<text x="55.0" y="357.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• pupil: II → III (Edinger-Westphal) · blown pupil = uncal herniation</text>
<text x="55.0" y="375.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Horner: ptosis, miosis ± anhidrosis · 3-neuron sympathetic path</text>
<text x="55.0" y="393.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• doll's eyes (no C-spine concern) + calorics: VIII → III, IV, VI</text>
<text x="55.0" y="411.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• calorics in COMA: only SLOW deviation toward cold · COWS is the awake fast phase</text>
<text x="55.0" y="429.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• corneal: V → VII · gag: IX → X · cough: often the LAST lost</text>

<text x="357.0" y="587.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">thalami, or brainstem above</text>
<text x="357.0" y="605.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">the mid-pons</text>

<text x="62.8" y="849.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">confounder</text>

<text x="267.0" y="741.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• cortex: metabolic, toxic,</text>
<text x="274.8" y="759.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">hypoxic-ischemic, trauma</text>
<text x="267.0" y="777.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• thalami: tip-of-the-basilar</text>
<text x="274.8" y="795.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">stroke, bleed, tumour</text>
