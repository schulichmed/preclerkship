<text x="845.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">history of the pain: NILDOCAAFIAT · Nature, Intensity, Location, Duration, Onset, Contributing, Aggravating, Alleviating,</text>
<text x="845.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">Frequency, Impact, Attribute, Treatment tried</text>
<text x="845.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">SNOOP4 red flags: Systemic (fever, weight loss) · Neurological deficits · Older onset (over 50) · Onset sudden (thunderclap) ·</text>
<text x="845.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">Papilledema · Positional · Precipitated by Valsalva · Progressive or a new pattern</text>
<text x="845.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">positional: worse LYING → raised pressure, mass · worse UPRIGHT → intracranial HYPOTENSION</text>
<text x="845.0" y="145.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">examine: vital signs · fundi (papilledema) · pupils, eye movements, visual fields · neurological exam · body habitus · neck ·</text>
