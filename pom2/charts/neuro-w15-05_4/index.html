<rect x="368.0" y="10.0" width="760.0" height="168.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="748.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Child with ataxia: a SIGN, not a diagnosis</text>
<text x="748.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">cerebellum: trouble walking or sitting, falls to one side, slurred speech, low tone, intention tremor</text>
<text x="748.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">cerebellar HEMISPHERE → limbs: over- or undershoots, clumsy · VERMIS → trunk: can't sit, wide-based gait</text>
<text x="748.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">also from vestibular disease (severe vertigo, vomiting, positional) or weakness, sensory or position-sense loss</text>
<text x="748.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">by stage: not walking → can't sit unsupported, misreaches · walking → wide-based, unsteady, clumsy, dysmetria, intention</text>
<text x="748.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">tremor</text>
<text x="748.0" y="145.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">IMAGE (MRI preferred, CT more accessible) if: ANY other neurologic finding · SUBACUTE course (weeks to months) ·</text>
<text x="748.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">TRAUMA</text>
<rect x="45.0" y="228.0" width="669.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>

<text x="379.5" y="273.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">the history sorts them</text>

<text x="975.0" y="273.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">brain tumour is one too</text>

<text x="606.5" y="403.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Brain tumour</text>
<text x="606.5" y="423.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">medulloblastoma · cerebellar</text>
<text x="606.5" y="441.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">astrocytoma</text>
<rect x="754.0" y="368.0" width="215.0" height="98.0" rx="10" fill="#a3336b" stroke="#a3336b" stroke-width="1.5"/>
<text x="861.5" y="393.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Stroke · hemorrhage ·</text>
<text x="861.5" y="413.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">infarction</text>
<text x="861.5" y="433.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">cerebellar vessel blocked or</text>
<text x="861.5" y="451.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">bleeding</text>
<rect x="981.0" y="368.0" width="215.0" height="98.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="1088.5" y="412.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Meningitis · encephalitis</text>
<text x="1088.5" y="432.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">viral or bacterial</text>
<rect x="1236.0" y="368.0" width="215.0" height="98.0" rx="10" fill="#4f6d1f" stroke="#4f6d1f" stroke-width="1.5"/>
<text x="1343.5" y="412.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Friedreich ataxia</text>
<text x="1343.5" y="432.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">autosomal RECESSIVE</text>
<rect x="45.0" y="506.0" width="215.0" height="168.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="152.5" y="531.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Access + ingestion</text>
<text x="55.0" y="551.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ethanol, anticonvulsants, cough</text>
<text x="62.8" y="569.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">syrup</text>

<text x="62.8" y="605.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">unsupervised time</text>

<text x="152.5" y="761.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">somnolent · sibling's</text>
