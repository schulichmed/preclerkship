<text x="715.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Several organs, often Raynaud's: ANA first, then the antibody names it</text>
<text x="715.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">ANA NEGATIVE → CTD unlikely · POSITIVE alone proves nothing (up to 30% of healthy people)</text>
<text x="715.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">everyone: CBC · ESR, CRP · creatinine · urinalysis</text>
<rect x="45.0" y="138.0" width="236.0" height="152.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="163.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">ANA + · <tspan font-weight="700" fill="#6a4aa8">anti-dsDNA</tspan> or</text>
<text x="163.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle"><tspan font-weight="700" fill="#6a4aa8">anti-Sm</tspan></text>
<text x="55.0" y="203.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• C3, C4 <tspan font-weight="700" fill="#6a4aa8">↓</tspan> in a flare</text>
<text x="55.0" y="221.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• WBC, platelets <tspan font-weight="700" fill="#6a4aa8">↓</tspan></text>
<text x="55.0" y="239.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• hemolysis</text>
<text x="55.0" y="257.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ESR <tspan font-weight="700" fill="#6a4aa8">↑</tspan> · CRP often <tspan font-weight="700" fill="#6a4aa8">normal</tspan></text>
<text x="55.0" y="275.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• urine: <tspan font-weight="700" fill="#6a4aa8">blood + protein</tspan></text>
<rect x="321.0" y="138.0" width="236.0" height="152.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="439.0" y="172.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle"><tspan font-weight="700" fill="#46607a">Anticardiolipin · lupus</tspan></text>
<text x="439.0" y="192.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">anticoagulant</text>
<text x="331.0" y="212.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• <tspan font-weight="700" fill="#46607a">PERSISTENT</tspan> on repeat</text>
<text x="331.0" y="230.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• platelets <tspan font-weight="700" fill="#46607a">↓</tspan></text>
<text x="331.0" y="248.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• PTT <tspan font-weight="700" fill="#46607a">falsely ↑</tspan></text>
<text x="331.0" y="266.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• <tspan font-weight="700" fill="#46607a">false-positive</tspan> VDRL</text>

<text x="715.0" y="191.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">ANA + · <tspan font-weight="700" fill="#1f6f8b">anti-Ro, anti-La</tspan></text>
<text x="607.0" y="211.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• RF <tspan font-weight="700" fill="#1f6f8b">+</tspan> in 90%</text>
<text x="607.0" y="229.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ESR <tspan font-weight="700" fill="#1f6f8b">VERY high</tspan> (IgG ↑)</text>
<text x="607.0" y="247.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• anemia · WBC <tspan font-weight="700" fill="#1f6f8b">↓</tspan></text>
<rect x="873.0" y="138.0" width="236.0" height="152.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="991.0" y="182.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle"><tspan font-weight="700" fill="#b5600f">CK HIGH</tspan> · <tspan font-weight="700" fill="#b5600f">anti-Jo-1</tspan></text>
<text x="883.0" y="202.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ANA + in 80%</text>
<text x="883.0" y="220.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ESR ↑ in half</text>
<text x="883.0" y="238.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• rule out <tspan font-weight="700" fill="#b5600f">statins, steroids</tspan></text>
<text x="883.0" y="256.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• and <tspan font-weight="700" fill="#b5600f">thyroid, K, phosphate</tspan></text>
<rect x="1149.0" y="138.0" width="236.0" height="152.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="1267.0" y="181.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">ANA + (nucleolar) ·</text>
<text x="1267.0" y="201.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle"><tspan font-weight="700" fill="#1f5f9e">centromere</tspan> or <tspan font-weight="700" fill="#1f5f9e">Scl-70</tspan></text>
<text x="1159.0" y="221.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• anticentromere → <tspan font-weight="700" fill="#1f5f9e">LIMITED</tspan></text>
<text x="1159.0" y="239.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• Scl-70 → <tspan font-weight="700" fill="#1f5f9e">diffuse</tspan>, lung fibrosis</text>
<text x="1159.0" y="257.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• RNA pol III → <tspan font-weight="700" fill="#1f5f9e">renal crisis</tspan></text>

<text x="163.0" y="395.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Systemic lupus</text>
<text x="163.0" y="415.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">erythematosus (SLE)</text>

<text x="439.0" y="435.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">half with SLE · or primary</text>
<rect x="597.0" y="370.0" width="236.0" height="80.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="715.0" y="405.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Sjögren's syndrome</text>

<text x="991.0" y="396.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Inflammatory myositis</text>

<text x="991.0" y="434.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">PAINLESS</text>

<text x="1267.0" y="395.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Systemic sclerosis</text>
<text x="1267.0" y="415.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">(scleroderma)</text>
<text x="1267.0" y="435.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">highest mortality</text>

<text x="55.0" y="555.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• malar rash (spares the nasolabial</text>
<text x="62.8" y="573.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">folds), discoid (SCARS),</text>

<text x="62.8" y="627.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">arthritis</text>
<text x="163.0" y="645.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">Raynaud's, hair loss common</text>

<text x="62.8" y="681.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">NOT spare the folds</text>
