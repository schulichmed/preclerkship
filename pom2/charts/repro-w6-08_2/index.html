<text x="61.0" y="1602.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• urinary: diuresis day 2–5 · ureters normal by 2–8 weeks · normal voiding by 3 months · blood:</text>
<text x="68.8" y="1622.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">volume normal by 1 week, cardiac output ↑ for 48 h, heart normal by 2 weeks</text>
<text x="61.0" y="1642.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• breasts: colostrum day 2 to ~4 · milk from day 3–5 · weight: −5–6 kg at birth, −2–3 kg diuresis,</text>
<text x="68.8" y="1662.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">most back to baseline by 6 months · hypoestrogenic state</text>
<text x="61.0" y="1682.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• ovulation can come BEFORE the first period: lactational amenorrhea is NOT contraception · not</text>
<text x="68.8" y="1702.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">breastfeeding: ovulation and menses at ~6–8 weeks</text>
<text x="61.0" y="1722.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• contraception from 6 weeks · NO estrogen before 21 days (clot risk); estrogen may ↓ milk</text>
