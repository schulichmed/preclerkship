<text x="706.0" y="1408.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• insomnia: sleep hygiene first · cognitive behavioural therapy if persistent · rule out a mood</text>
