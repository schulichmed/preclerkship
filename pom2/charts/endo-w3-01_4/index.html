<text x="581.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Adrenal disease: one zone making TOO MUCH, or the whole cortex making TOO LITTLE</text>
<text x="581.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">glomerulosa → aldosterone · fasciculata → cortisol · reticularis → androgens · medulla → catecholamines</text>
<text x="581.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">always ask about exogenous steroid · a random cortisol is uninterpretable</text>

<text x="171.0" y="370.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">cortisol ↓ + aldosterone ↓</text>
