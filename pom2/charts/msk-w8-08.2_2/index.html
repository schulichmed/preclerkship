<rect x="197.0" y="10.0" width="760.0" height="60.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="577.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Fall on an outstretched hand (FOOSH): which bone, and does it need SURGERY?</text>
<text x="577.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">age, activity and displacement decide</text>
<rect x="45.0" y="120.0" width="512.0" height="78.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="301.0" y="154.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">DISTAL RADIUS: very common</text>
<text x="301.0" y="174.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">poor function if anatomy not restored</text>
<rect x="597.0" y="120.0" width="512.0" height="78.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="853.0" y="145.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">SCAPHOID: young people</text>
<text x="853.0" y="165.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">retrograde blood supply</text>
<text x="853.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">missed → nonunion, osteonecrosis</text>
<rect x="45.0" y="238.0" width="512.0" height="96.0" rx="10" fill="#e3edf8" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="301.0" y="263.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">X-ray: 3 questions</text>
<text x="55.0" y="283.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• CROOKED? normal palmar tilt 12°</text>
<text x="55.0" y="301.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• SHORT? ulnar variance past neutral</text>
<text x="55.0" y="319.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• SMOOTH? step &gt; 1 mm</text>
<rect x="597.0" y="238.0" width="512.0" height="96.0" rx="10" fill="#e3edf8" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="853.0" y="263.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Be SUSPICIOUS</text>
<text x="607.0" y="283.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• snuffbox tender, X-ray NORMAL → cast</text>
<text x="607.0" y="301.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• repeat X-ray in 10-14 days</text>
<text x="607.0" y="319.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• still suspected → CT or MRI</text>
<rect x="45.0" y="414.0" width="250.0" height="60.0" rx="10" fill="#1f5f9e" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="170.0" y="439.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">CLOSED reduction + cast</text>
<text x="170.0" y="459.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">forgiving at the extremes of age</text>
<rect x="307.0" y="414.0" width="250.0" height="60.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="432.0" y="439.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">SURGICAL reduction</text>
<text x="432.0" y="459.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">still crooked, short or not smooth</text>
<rect x="597.0" y="414.0" width="250.0" height="60.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="722.0" y="439.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Cast</text>
<text x="722.0" y="459.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">undisplaced, or distal pole</text>
<rect x="859.0" y="414.0" width="250.0" height="60.0" rx="10" fill="#a3336b" stroke="#a3336b" stroke-width="1.5"/>
<text x="984.0" y="439.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Surgery</text>
<text x="984.0" y="459.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">displaced, or proximal pole</text>
<rect x="45.0" y="514.0" width="250.0" height="78.0" rx="10" fill="#ffffff" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="170.0" y="539.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">1 · Analgesia</text>
<text x="55.0" y="559.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• hematoma block (1% lidocaine)</text>
<text x="55.0" y="577.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• regional or conscious sedation</text>
<rect x="45.0" y="614.0" width="250.0" height="60.0" rx="10" fill="#ffffff" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="170.0" y="639.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">2 · Reduce</text>
<text x="170.0" y="659.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">traction: INCREASE, then correct</text>
<rect x="307.0" y="514.0" width="250.0" height="160.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="432.0" y="580.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Left uncorrected</text>
<text x="317.0" y="600.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• crooked: rotation restricted</text>
<text x="317.0" y="618.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• short: ulnar impaction</text>
<rect x="597.0" y="514.0" width="250.0" height="160.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="722.0" y="580.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">A normal X-ray can hide it</text>
<text x="607.0" y="600.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• CT can show the line</text>
<text x="607.0" y="618.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• tubercle fracture = distal</text>
<rect x="859.0" y="514.0" width="250.0" height="160.0" rx="10" fill="#ffffff" stroke="#a3336b" stroke-width="1.5"/>
<text x="984.0" y="589.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a3336b" text-anchor="middle">Displaced proximal pole</text>
<text x="984.0" y="609.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">seen on X-ray + CT</text>
<rect x="45.0" y="714.0" width="250.0" height="60.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="170.0" y="739.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">3 · Cast, 3-point mould</text>
<text x="170.0" y="759.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">well moulded is NOT tight</text>
<rect x="45.0" y="796.0" width="250.0" height="60.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="170.0" y="821.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">4 · Rehabilitate</text>
<text x="170.0" y="841.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">range of motion + strength</text>
<rect x="45.0" y="878.0" width="250.0" height="78.0" rx="10" fill="#fbe5e3" stroke="#b3261e" stroke-width="1.5"/>
<text x="170.0" y="903.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b3261e" text-anchor="middle">Cast TOO TIGHT</text>
<text x="170.0" y="923.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">acute CTS ± compartment syndrome</text>
<text x="170.0" y="941.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">split cast + padding, elevate</text>
<rect x="307.0" y="714.0" width="250.0" height="66.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="432.0" y="742.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">ORIF or external fixation</text>
<text x="432.0" y="762.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">then rehabilitate</text>
<rect x="307.0" y="802.0" width="250.0" height="66.0" rx="10" fill="#fbe5e3" stroke="#b3261e" stroke-width="1.5"/>
<text x="432.0" y="830.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b3261e" text-anchor="middle">Joint NOT smooth</text>
<text x="432.0" y="850.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">radiocarpal arthritis → fusion</text>
<rect x="307.0" y="890.0" width="250.0" height="66.0" rx="10" fill="#fbe5e3" stroke="#b3261e" stroke-width="1.5"/>
<text x="432.0" y="918.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b3261e" text-anchor="middle">After ORIF: FPL RUPTURE</text>
<text x="432.0" y="938.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">can't flex thumb IP, sensation normal</text>
<rect x="597.0" y="714.0" width="250.0" height="242.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="722.0" y="839.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Cast until union</text>
<rect x="859.0" y="714.0" width="250.0" height="242.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="984.0" y="830.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Operative fixation</text>
<text x="984.0" y="850.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">volar approach, screw</text>
<text x="170.0" y="374.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">displaced</text>
<text x="432.0" y="374.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">reduction inadequate</text>
<text x="722.0" y="374.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">undisplaced or DISTAL</text>
<text x="984.0" y="374.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">displaced or PROXIMAL</text>
