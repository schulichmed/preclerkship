<text x="811.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">A child's eyes: acuity in EACH eye, alignment, red reflex</text>
<text x="811.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">anything that blurs, blocks or misaligns one eye while vision develops → AMBLYOPIA</text>
<text x="811.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">early detection and early treatment are what restore vision</text>
<text x="811.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">red reflex: the most important pediatric eye test · no contact, no dilating drops, seconds · ophthalmoscope, retinoscope, flash</text>
<text x="811.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">photos, or parents notice asymmetry</text>
<text x="811.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">strabismus exam: acuity · obvious turn? · NYSTAGMUS · cardinal gazes · corneal light reflexes · cover test · red reflex</text>
<rect x="45.0" y="192.0" width="732.0" height="96.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="411.0" y="217.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">RED REFLEX (Brückner): both eyes at once</text>
<text x="411.0" y="237.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">dim room · 1/3 m or more · child looking far away</text>
<text x="411.0" y="255.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">compare brightness, colour, alignment, symmetry</text>
<text x="411.0" y="273.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">disease in both eyes is easy to miss if they match</text>
<rect x="817.0" y="192.0" width="484.0" height="96.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="1059.0" y="235.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">MISALIGNED: does the angle change with gaze?</text>
<text x="1059.0" y="255.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">corneal light reflexes · cover test (from 6-7 months) · cardinal gazes</text>
<rect x="1341.0" y="192.0" width="236.0" height="96.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="1459.0" y="235.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">ACUITY ↓ in one eye</text>
<text x="1459.0" y="255.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">no eye disease to explain it</text>

<text x="163.0" y="420.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Dim or different reflex</text>
<rect x="293.0" y="368.0" width="236.0" height="96.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="411.0" y="420.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Brighter reflex</text>
<rect x="541.0" y="368.0" width="236.0" height="96.0" rx="10" fill="#a3336b" stroke="#a3336b" stroke-width="1.5"/>
<text x="659.0" y="411.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Leukocoria</text>
<text x="659.0" y="431.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">a WHITE pupillary reflex</text>
<rect x="817.0" y="368.0" width="236.0" height="96.0" rx="10" fill="#6a4aa8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="935.0" y="411.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Concomitant strabismus</text>
<text x="935.0" y="431.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">non-paralytic</text>
<rect x="1065.0" y="368.0" width="236.0" height="96.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="1183.0" y="411.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Incomitant strabismus</text>
<text x="1183.0" y="431.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">paralytic or restrictive</text>
<rect x="1341.0" y="368.0" width="236.0" height="96.0" rx="10" fill="#4f6d1f" stroke="#4f6d1f" stroke-width="1.5"/>
<text x="1459.0" y="393.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Amblyopia</text>
<text x="1459.0" y="413.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">↓ acuity, NO organic disease</text>
<text x="1459.0" y="431.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">disrupted visual development ·</text>
<text x="1459.0" y="449.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">usually one eye, can be both</text>
<rect x="45.0" y="504.0" width="236.0" height="132.0" rx="10" fill="#dde9f7" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="163.0" y="547.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">One reflex DIMMER</text>
<text x="55.0" y="567.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• or a visible opacity in it</text>
<text x="55.0" y="585.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• the eye with the larger refractive</text>
<text x="62.8" y="603.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">error is dimmer</text>
<rect x="293.0" y="504.0" width="236.0" height="132.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="411.0" y="547.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">One reflex BRIGHTER</text>
<text x="303.0" y="567.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• its pupil looks slightly larger</text>
<text x="303.0" y="585.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• finds turns as small as 3 prism</text>
<text x="310.8" y="603.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">dioptres</text>
<rect x="541.0" y="504.0" width="236.0" height="132.0" rx="10" fill="#f8e0ec" stroke="#a3336b" stroke-width="1.5"/>
<text x="659.0" y="538.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a3336b" text-anchor="middle">White reflex</text>
<text x="551.0" y="558.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• may be the first sign of a</text>
<text x="558.8" y="576.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">life-threatening disease</text>
<text x="659.0" y="594.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">physiologic white reflex ~15° off axis:</text>
<text x="659.0" y="612.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6577" text-anchor="middle" font-style="italic">still refer</text>
<rect x="817.0" y="504.0" width="236.0" height="132.0" rx="10" fill="#ebe4f7" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="935.0" y="529.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">SAME angle in every gaze</text>
<text x="827.0" y="549.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• muscles work, eyes not aimed</text>
<text x="834.8" y="567.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">together</text>
<text x="827.0" y="585.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• starts in childhood</text>
<text x="827.0" y="603.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• adults: DIPLOPIA · children:</text>
<text x="834.8" y="621.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">suppression</text>
<rect x="1065.0" y="504.0" width="236.0" height="132.0" rx="10" fill="#fbe8d3" stroke="#b5600f" stroke-width="1.5"/>
<text x="1183.0" y="556.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Angle CHANGES with gaze</text>
<text x="1183.0" y="576.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">a muscle or nerve not working, or</text>
<text x="1183.0" y="594.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">tethered</text>
<rect x="1341.0" y="504.0" width="236.0" height="132.0" rx="10" fill="#e7eed9" stroke="#4f6d1f" stroke-width="1.5"/>
<text x="1459.0" y="529.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#4f6d1f" text-anchor="middle">Test EACH eye</text>
<text x="1351.0" y="549.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• newborn: light reflexes, pupils,</text>
<text x="1358.8" y="567.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">fundus</text>
<text x="1351.0" y="585.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• to age 2: fusses when the GOOD</text>
<text x="1358.8" y="603.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">eye is covered</text>
<text x="1351.0" y="621.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• 2-5: HOTV, tumbling E charts</text>
<rect x="45.0" y="676.0" width="236.0" height="204.0" rx="10" fill="#ffffff" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="163.0" y="728.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Refractive error or opacity</text>
<text x="55.0" y="748.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• myopia, hyperopia, astigmatism</text>

<text x="61.0" y="1242.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• 3-year survival ~96% · &gt; 95% cured with optimal care · up to 70% die when diagnosed late worldwide</text>

<text x="659.0" y="328.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">white</text>
