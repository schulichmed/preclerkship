<h1>Red Eye and Ocular Trauma</h1>

<details class="orig"><summary>Compare with the chart as it is in the notes</summary><div class="paper"><svg xmlns="http://www.w3.org/2000/svg" width="2078" height="1558" viewBox="0 0 2078 1558" role="img" aria-labelledby="t"><title id="t">Red eye: red flags decide whether it is vision threatening. Without them it is the lids, a conjunctivitis told apart by its discharge and itch, a subconjunctival hemorrhage or a corneal abrasion; with them it is keratitis, anterior uveitis or acute angle closure glaucoma and needs urgent ophthalmology; each column gives the presentation, the exam finding that decides it and the treatment, and a last column for the other vision threats (orbit, sclera, globe)</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>

<rect x="674.0" y="10.0" width="760.0" height="204.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="1054.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Red eye: is it VISION THREATENING?</text>
<text x="1054.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">2-3% of primary care and emergency visits</text>
<text x="1054.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">red flag symptoms: blurred vision that does NOT clear with blinking (clears = discharge) · SEVERE pain (keratitis, ulcer, iritis,</text>
<text x="1054.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">scleritis, glaucoma) · photophobia (iritis) · coloured halos (corneal edema, high pressure)</text>
<text x="1054.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">red flag signs: ↓ acuity · ciliary flush · corneal opacity · abnormal pupil · shallow chamber · ↑ pressure · proptosis</text>
<text x="1054.0" y="127.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">ask: onset, one or both eyes · pain, photophobia · discharge type + amount · itch · vision · recent cold · family member with red</text>
<text x="1054.0" y="145.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">eye · contact lenses (swim, sleep, shower in them?) · trauma, eye surgery · eye drops · autoimmune disease</text>
<text x="1054.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">exam: acuity, glasses on, one eye at a time · pupils · eye movements · node in front of the ear, dermatomal rash (zoster) ·</text>
<text x="1054.0" y="181.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">evert the lid · diffuse redness vs ciliary flush · fluorescein + cobalt blue light · blood (hyphema) or pus (hypopyon) in the</text>
<text x="1054.0" y="199.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">chamber, chamber depth</text>
<rect x="45.0" y="264.0" width="1262.0" height="114.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="676.0" y="307.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">NO red flags: lids, conjunctiva, surface</text>
<text x="676.0" y="327.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">acuity and pressure normal: treat or reassure</text>
<text x="55.0" y="345.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• NOT threatening: blepharitis, stye, chalazion, conjunctivitis, dry eye, abrasion, subconjunctival hemorrhage</text>
<rect x="1347.0" y="264.0" width="716.0" height="114.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="1705.0" y="289.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">RED FLAGS: vision threatening</text>
<text x="1705.0" y="309.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">URGENT referral to ophthalmology</text>
<text x="1357.0" y="327.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• cornea: ulcer, keratitis</text>
<text x="1357.0" y="345.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• anterior chamber: uveitis, acute angle closure</text>
<text x="1357.0" y="363.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• scleritis · trauma · orbital cellulitis</text>
<rect x="45.0" y="458.0" width="170.0" height="134.0" rx="10" fill="#8a5a2b" stroke="#8a5a2b" stroke-width="1.5"/>
<text x="130.0" y="501.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Stye · chalazion ·</text>
<text x="130.0" y="521.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">entropion</text>
<text x="130.0" y="541.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">LIDS · also blepharitis,</text>
<text x="130.0" y="559.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">ectropion</text>

<text x="312.0" y="522.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">CONJUNCTIVA · usually</text>
<text x="312.0" y="540.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">adenovirus</text>
<text x="312.0" y="558.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">with sore throat, fever</text>
<rect x="409.0" y="458.0" width="170.0" height="134.0" rx="10" fill="#1f5f9e" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="494.0" y="483.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Bacterial</text>
<text x="494.0" y="503.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">conjunctivitis</text>
<text x="494.0" y="523.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">Staph aureus, Staph</text>
<text x="494.0" y="541.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">epidermidis &gt; Strep</text>
<text x="494.0" y="559.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">pneumoniae, H.</text>
<text x="494.0" y="577.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">influenzae</text>
<rect x="591.0" y="458.0" width="170.0" height="134.0" rx="10" fill="#a3336b" stroke="#a3336b" stroke-width="1.5"/>
<text x="676.0" y="510.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Gonococcal</text>
<text x="676.0" y="530.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">conjunctivitis</text>
<text x="676.0" y="550.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">or chlamydial</text>
