<rect x="359.0" y="10.0" width="760.0" height="116.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="739.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Amenorrhea: 1 · β-hCG FIRST in every case (positive = PREGNANCY), then sort in order: 2 · uterus?</text>
<text x="739.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">→ 3 · prolactin + TSH → 4 · FSH</text>
<text x="739.0" y="75.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">PRIMARY: no menses by 15 WITH breast development (or 3 years after thelarche), or by 13 with no secondary sex</text>
<text x="739.0" y="93.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">characteristics</text>

<text x="151.0" y="231.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">on ultrasound + bimanual</text>

<text x="403.0" y="221.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">HIGH</text>
<text x="403.0" y="241.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">uterus present</text>

<text x="991.0" y="222.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">uterus present · prolactin + TSH NORMAL</text>

<text x="655.0" y="369.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">→ KARYOTYPE</text>
<rect x="773.0" y="296.0" width="212.0" height="116.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="879.0" y="340.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">FSH LOW, estrogen LOW</text>
<text x="879.0" y="360.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">eating disorder, exercise,</text>

<text x="1007.0" y="379.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• BLEED = estrogen present + outflow OPEN</text>
