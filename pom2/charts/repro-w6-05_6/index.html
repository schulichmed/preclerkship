<text x="813.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Labour is not going to plan: which fix, in what order?</text>
<text x="813.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">reach for them in this order: induce or augment → forceps or vacuum → cesarean section (C/S)</text>
<text x="813.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">the 4 P's: Power (contractions, pushing) · Passage (bony pelvis) · Passenger (presentation, position, size) · Psyche (support)</text>
