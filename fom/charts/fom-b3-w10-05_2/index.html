<text x="830.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Platelets &lt; 150 × 10⁹/L: how LOW, and are they MADE too few, DESTROYED, POOLED or</text>
