<rect x="70.0" y="10.0" width="760.0" height="96.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="450.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Acutely confused older adult: DELIRIUM? Then FIND THE TRIGGER</text>
<text x="450.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">delirium = an ACUTE, FLUCTUATING change in attention and awareness</text>
<text x="450.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">the QUIET one is missed: HYPOACTIVE (drowsy, lethargic) is the commonest, mistaken for DEPRESSION</text>
<text x="450.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">screen with the 4-AT: &lt; 2 minutes, no special training</text>
<rect x="45.0" y="156.0" width="810.0" height="78.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="450.0" y="181.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">4-AT ≥ 4: POSSIBLE DELIRIUM → hunt EVERY trigger (DIMES + 3 Ps)</text>
<text x="55.0" y="201.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• clearly abnormal ALERTNESS, or an ACUTE change / fluctuation: 4 points EACH</text>
<text x="55.0" y="219.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• 1–3: possible cognitive impairment (COGNITIVE DECLINE chart) · 0: neither</text>
<rect x="45.0" y="314.0" width="262.0" height="42.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="176.0" y="339.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Drugs · Environment</text>
<rect x="319.0" y="314.0" width="262.0" height="42.0" rx="10" fill="#1f5f9e" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="450.0" y="339.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Infection · Metabolic · Structural</text>
<rect x="593.0" y="314.0" width="262.0" height="42.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="724.0" y="339.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Pee · Poo · Pain</text>
<rect x="45.0" y="396.0" width="262.0" height="114.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="176.0" y="421.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Drugs</text>
<text x="55.0" y="441.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• benzodiazepines, anticholinergics,</text>
<text x="62.8" y="459.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">antihistamines</text>
<text x="55.0" y="477.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• narcotics, antipsychotics, alcohol</text>
<text x="55.0" y="495.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• polypharmacy</text>
<rect x="45.0" y="532.0" width="262.0" height="96.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="176.0" y="557.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Environment</text>
<text x="55.0" y="577.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• glasses, hearing aids out of reach</text>
<text x="55.0" y="595.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• noise, light, broken sleep</text>
<text x="55.0" y="613.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• restraints, immobility</text>
<rect x="319.0" y="396.0" width="262.0" height="114.0" rx="10" fill="#dde9f7" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="450.0" y="430.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Acute illness</text>
<text x="329.0" y="450.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• infection</text>
<text x="329.0" y="468.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• sodium or calcium ↓ or ↑, glucose ↑</text>
<text x="329.0" y="486.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• central nervous system event</text>
<rect x="319.0" y="532.0" width="262.0" height="96.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="450.0" y="566.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">It may show ONLY as delirium</text>
<text x="450.0" y="586.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">atypical presentations: see the FRAILTY</text>
<text x="450.0" y="604.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">AND FALLS chart</text>
<rect x="593.0" y="396.0" width="262.0" height="232.0" rx="10" fill="#fbe8d3" stroke="#b5600f" stroke-width="1.5"/>
<text x="724.0" y="489.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">What they can't report reliably</text>
<text x="603.0" y="509.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• urinary tract infection (UTI), retention</text>
<text x="603.0" y="527.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• constipation, impaction</text>
<text x="603.0" y="545.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• uncontrolled pain, or its medication</text>
<rect x="45.0" y="668.0" width="262.0" height="142.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="176.0" y="743.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Medication + alcohol history</text>
<rect x="319.0" y="668.0" width="262.0" height="142.0" rx="10" fill="#ffffff" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="450.0" y="698.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Labs</text>
<text x="329.0" y="718.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• complete blood count (CBC),</text>
<text x="336.8" y="736.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">electrolytes (extended), glucose</text>
<text x="329.0" y="754.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• creatinine, urea, creatine kinase</text>
<text x="329.0" y="772.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• liver tests, thyroid-stimulating hormone</text>
<text x="336.8" y="790.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">(TSH), B12</text>
<rect x="593.0" y="668.0" width="262.0" height="78.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="724.0" y="693.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">COLLATERAL history</text>
<text x="724.0" y="713.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">caregiver, personal support worker,</text>
<text x="724.0" y="731.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">nursing</text>
<rect x="593.0" y="768.0" width="262.0" height="42.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="724.0" y="793.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Examine even if they deny it</text>
<rect x="45.0" y="850.0" width="262.0" height="60.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="176.0" y="875.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">STOP offending drugs</text>
<text x="176.0" y="895.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">lower psychoactive doses</text>
<rect x="45.0" y="932.0" width="262.0" height="114.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="176.0" y="957.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Fix the environment</text>
<text x="55.0" y="977.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• glasses + hearing aids, reorientation</text>
<text x="55.0" y="995.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• sleep: less noise and light, ear plugs</text>
<text x="55.0" y="1013.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• mobilize early, fewest restraints, family</text>
<text x="62.8" y="1031.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">at the bedside</text>
<rect x="45.0" y="1068.0" width="262.0" height="188.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="176.0" y="1093.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">Drugs for SYMPTOMS: NOT</text>
<text x="176.0" y="1113.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">evidence based</text>
<text x="55.0" y="1133.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• hyperactive: antipsychotic first; watch</text>
<text x="62.8" y="1151.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">the QT; avoid in seizures, Parkinson's,</text>
<text x="62.8" y="1169.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">Lewy body dementia</text>
<text x="55.0" y="1187.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• alcohol withdrawal → a benzodiazepine</text>
<text x="62.8" y="1205.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">instead</text>
<text x="55.0" y="1223.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• anticholinergic toxidrome →</text>
<text x="62.8" y="1241.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">physostigmine</text>
<rect x="319.0" y="850.0" width="262.0" height="182.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="450.0" y="945.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Treat each trigger</text>
<rect x="319.0" y="1054.0" width="262.0" height="202.0" rx="10" fill="#fbeedd" stroke="#a45a12" stroke-width="1.5"/>
<text x="450.0" y="1149.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">Slow to clear? Hunt for NEW</text>
<text x="450.0" y="1169.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#a45a12" text-anchor="middle">triggers</text>
<rect x="593.0" y="850.0" width="262.0" height="406.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="724.0" y="1048.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">Treat each one</text>
