<svg xmlns="http://www.w3.org/2000/svg" width="1112" height="738" viewBox="0 0 1112 738" role="img" aria-labelledby="t"><title id="t">Older adult periodic health encounter: ALBUS frames the visit; bone density for women 65 and over and a one-time aortic aneurysm ultrasound for men 65 to 80 are added, pneumococcal, shingles and tetanus vaccines are given, and PSA, asymptomatic cognitive or thyroid screening and routine chest X-ray, blood count, ECG and exam are not recommended</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
