<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="956" viewBox="0 0 1152 956" role="img" aria-labelledby="t"><title id="t">Antimicrobial resistance decision chart: a resistant organism has either an enzyme that destroys the drug (penicillinase, AmpC in the SPACE organisms, extended-spectrum beta-lactamase, carbapenemase), an altered target (MRSA, penicillin-resistant S. pneumoniae, vancomycin-resistant Enterococcus, vancomycin-intermediate S. aureus), a way to keep the drug out (porins, efflux pumps) or a bypass of the blocked pathway (folate scavenging against sulfonamides); each tells you which drugs it takes out</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
