<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="564" viewBox="0 0 1100 564" role="img" aria-labelledby="t"><title id="t">Anemia sorted by the mean cell volume on the complete blood count: microcytic, normocytic or macrocytic, plus hemolysis at any size, each pointing to its own approach chart</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
