<svg xmlns="http://www.w3.org/2000/svg" width="862" height="726" viewBox="0 0 862 726" role="img" aria-labelledby="t"><title id="t">Myelodysplastic syndrome: after the marrow workup, the International Prognostic Scoring System splits lower risk (quality of life) from higher risk (slow progression to leukemia), and del(5q) is treated with lenalidomide</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
