<svg xmlns="http://www.w3.org/2000/svg" width="1136" height="800" viewBox="0 0 1136 800" role="img" aria-labelledby="t"><title id="t">Clostridia decision chart: anaerobic spore-forming Gram-positive bacilli told apart by what the patient shows: diarrhea after antibiotics (C. difficile), dying or infected tissue (C. perfringens, septicum, sordellii), spastic paralysis (tetanus) or flaccid paralysis (botulism), each with the toxin action that explains it</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<rect x="40" y="252" width="256" height="534" rx="16" fill="#f4f7ee" stroke="#4f6d1f" stroke-opacity="0.25"/>
<rect x="326" y="252" width="256" height="534" rx="16" fill="#faf4ee" stroke="#8a5a2b" stroke-opacity="0.25"/>
<rect x="612" y="252" width="256" height="534" rx="16" fill="#fdf4ea" stroke="#b5600f" stroke-opacity="0.25"/>
<rect x="870" y="252" width="256" height="534" rx="16" fill="#eff5fc" stroke="#1f5f9e" stroke-opacity="0.25"/>
<path d="M33 378H29V578H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 478.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">PRESENTS AS</text>
<path d="M33 618H29V778H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 698.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">TOXIN → EFFECT</text>
<path d="M998.0 180.0L998.0 258.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M998.0 578.0L998.0 616.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M998.0 338.0L998.0 376.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M740.0 180.0L740.0 258.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M740.0 578.0L740.0 616.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M740.0 338.0L740.0 376.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M454.0 180.0L454.0 258.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M454.0 578.0L454.0 616.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M454.0 338.0L454.0 376.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
