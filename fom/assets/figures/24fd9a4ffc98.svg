<rect x="177.0" y="10.0" width="760.0" height="78.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="557.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Is it attention deficit hyperactivity disorder (ADHD), and which presentation?</text>
<text x="557.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">assess: parent AND child interviews across settings · SNAP-IV rating scale · psychological tests</text>
<text x="557.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">judge against what is NORMAL for the child's age: a yes/no checklist alone is not enough</text>
<rect x="45.0" y="138.0" width="744.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="417.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">ADHD only if ALL of these hold</text>
<text x="417.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">symptoms ≥ 6 months · several before age 12 · in 2+ settings (home, school, friends) · clear impairment of functioning</text>
<rect x="829.0" y="138.0" width="240.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="949.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">NOT ADHD</text>
<text x="949.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">a diagnosis of EXCLUSION</text>
<rect x="45.0" y="278.0" width="240.0" height="62.0" rx="10" fill="#1f5f9e" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="165.0" y="313.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Predominantly inattentive</text>
<rect x="297.0" y="278.0" width="240.0" height="62.0" rx="10" fill="#6a4aa8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="417.0" y="313.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Combined</text>
<rect x="549.0" y="278.0" width="240.0" height="62.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="669.0" y="303.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Predominantly</text>
<text x="669.0" y="323.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">hyperactive-impulsive</text>
<rect x="829.0" y="278.0" width="240.0" height="62.0" rx="10" fill="#46607a" stroke="#46607a" stroke-width="1.5"/>
<text x="949.0" y="313.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Something else</text>
<rect x="45.0" y="380.0" width="240.0" height="80.0" rx="10" fill="#dde9f7" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="165.0" y="415.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">6+ of 9 INATTENTION</text>
<text x="165.0" y="435.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">fewer than 6 hyperactive-impulsive</text>
<rect x="297.0" y="380.0" width="240.0" height="80.0" rx="10" fill="#ebe4f7" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="417.0" y="415.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">6+ of 9 in BOTH lists</text>
<text x="417.0" y="435.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">count each list separately</text>
<rect x="549.0" y="380.0" width="240.0" height="80.0" rx="10" fill="#fbe8d3" stroke="#b5600f" stroke-width="1.5"/>
<text x="669.0" y="405.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">6+ of 9</text>
<text x="669.0" y="425.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">HYPERACTIVE-IMPULSIVE</text>
<text x="669.0" y="445.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">fewer than 6 inattentive</text>
<rect x="829.0" y="380.0" width="240.0" height="80.0" rx="10" fill="#e2e8ee" stroke="#46607a" stroke-width="1.5"/>
<text x="949.0" y="406.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#46607a" text-anchor="middle">Typical for age?</text>
<text x="949.0" y="426.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">what if the child were 5? where is the</text>
<text x="949.0" y="444.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">impairment?</text>
<rect x="45.0" y="500.0" width="240.0" height="114.0" rx="10" fill="#ffffff" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="165.0" y="534.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Often</text>
<text x="55.0" y="554.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• careless mistakes, loses things</text>
<text x="55.0" y="572.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• doesn't seem to listen or finish tasks</text>
<text x="55.0" y="590.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• easily distracted, forgetful</text>
<rect x="297.0" y="500.0" width="240.0" height="114.0" rx="10" fill="#ffffff" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="417.0" y="543.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Both patterns</text>
<text x="417.0" y="563.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">inattention AND</text>
<text x="417.0" y="581.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">hyperactivity-impulsivity</text>
<rect x="549.0" y="500.0" width="240.0" height="114.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="669.0" y="525.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">Often</text>
<text x="559.0" y="545.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• fidgets, leaves seat, 'driven by a</text>
<text x="566.8" y="563.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">motor'</text>
<text x="559.0" y="581.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• talks excessively, blurts out answers</text>
<text x="559.0" y="599.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• can't wait a turn, interrupts</text>
<rect x="829.0" y="500.0" width="240.0" height="114.0" rx="10" fill="#ffffff" stroke="#46607a" stroke-width="1.5"/>
<text x="949.0" y="525.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#46607a" text-anchor="middle">Better explained by</text>
<text x="839.0" y="545.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• mood, anxiety, dissociative or</text>
<text x="846.8" y="563.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">personality disorder</text>
<text x="839.0" y="581.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• substance intoxication or withdrawal</text>
<text x="839.0" y="599.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• only during psychosis</text>
<rect x="829.0" y="654.0" width="240.0" height="196.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="949.0" y="747.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Criteria NOT met</text>
<text x="949.0" y="767.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">no ADHD diagnosis</text>
<rect x="45.0" y="654.0" width="744.0" height="96.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="417.0" y="679.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">MULTIMODAL, for every presentation</text>
<text x="55.0" y="699.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• psychoeducation</text>
<text x="55.0" y="717.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• parent training / behavioural management</text>
<text x="55.0" y="735.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• school accommodation</text>
<rect x="45.0" y="772.0" width="744.0" height="78.0" rx="10" fill="#e2f2ea" stroke="#2f7d5b" stroke-width="1.5"/>
<text x="417.0" y="797.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#2f7d5b" text-anchor="middle">+ Medication</text>
<text x="55.0" y="817.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• stimulants: no response to one → try the other (90% respond to one or the other)</text>
<text x="55.0" y="835.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• non-stimulants</text>
<text x="165.0" y="238.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6+ inattentive</text>
<text x="417.0" y="238.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6+ of each</text>
<text x="669.0" y="238.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">6+ hyperactive</text>
</svg>
