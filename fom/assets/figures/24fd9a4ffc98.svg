<svg xmlns="http://www.w3.org/2000/svg" width="1084" height="872" viewBox="0 0 1084 872" role="img" aria-labelledby="t"><title id="t">Is it attention deficit hyperactivity disorder (ADHD)? All criteria must hold; the symptom counts sort it into inattentive, combined or hyperactive-impulsive presentations; anything better explained by another disorder or typical for age is not ADHD; treatment is multimodal</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<rect x="40" y="270" width="250" height="352" rx="16" fill="#eff5fc" stroke="#1f5f9e" stroke-opacity="0.25"/>
<rect x="292" y="270" width="250" height="352" rx="16" fill="#f5f1fb" stroke="#6a4aa8" stroke-opacity="0.25"/>
<rect x="544" y="270" width="250" height="352" rx="16" fill="#fdf4ea" stroke="#b5600f" stroke-opacity="0.25"/>
<rect x="824" y="270" width="250" height="588" rx="16" fill="#f2f5f8" stroke="#46607a" stroke-opacity="0.25"/>
<path d="M33 380H29V460H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 420.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">COUNT</text>
<path d="M33 500H29V614H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 557.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">LOOKS LIKE</text>
<path d="M33 654H29V850H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 752.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">TREATMENT</text>
