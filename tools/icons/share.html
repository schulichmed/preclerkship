<!doctype html>
<!-- The 1200x630 link-preview card. Render with: node tools/icons/render.js -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background:
      radial-gradient(520px 420px at 1080px 560px, rgba(140,110,230,.55), transparent 70%),
      linear-gradient(135deg,#201436 0%,#3a1d63 45%,#4f2585 100%);
    color:#fff;font-family:Inter,sans-serif;position:relative}
  .wrap{position:absolute;left:96px;top:86px;right:96px}
  .eyebrow{color:#7fe3f0;font-weight:600;font-size:23px;letter-spacing:.14em}
  h1{font-family:Fraunces,serif;font-weight:600;font-size:86px;line-height:1.05;margin:22px 0 26px;letter-spacing:-.01em}
  p{font-size:31px;line-height:1.5;color:#e4dcf3;margin:0;max-width:900px}
  .chips{position:absolute;left:96px;bottom:84px;display:flex;gap:16px}
  .chip{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);border-radius:26px;
    padding:12px 20px;font-size:22px;font-weight:600}
  .chip b{color:#a3e36b}
</style></head>
<body>
  <div class="wrap">
    <div class="eyebrow">SCHULICH MEDICINE · PRE-CLERKSHIP</div>
    <h1>Schulich MedFriend.</h1>
    <p>Lecture notes and 6,500 practice questions, with the explanations linked back to the notes that teach them.</p>
  </div>
  <div class="chips">
    <span class="chip">FoM</span><span class="chip">PoM 1</span><span class="chip">PoM 2</span><span class="chip">T2C</span>
    <span class="chip"><b>Free</b> · student-run, unofficial</span>
  </div>
</body></html>
