<rect x="485.0" y="10.0" width="760.0" height="114.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="865.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Chest X-ray (CXR): read it the SAME WAY every time, DRS. ABCDE, so nothing is missed</text>
<text x="865.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">Details · RIPE: Rotation (clavicle ends equidistant), Inspiration (anterior ribs 5–6 or posterior 8–10), Picture, Exposure</text>
<text x="865.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">Soft tissue, bones · Airway, mediastinum: TRACHEA deviated? · Breathing: PNEUMOTHORAX?</text>
<text x="865.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">Circulation: heart size on a back-to-front (PA) film; a portable front-to-back film magnifies it</text>
<text x="865.0" y="109.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">Diaphragm: FREE AIR? (see the ACUTE ABDOMEN chart) · Extras: tubes, lines, devices · compare with OLD films</text>
<rect x="45.0" y="174.0" width="900.0" height="80.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>

<text x="495.0" y="229.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">a whole side white? the MIDLINE (trachea, heart borders) tells you which</text>
