<text x="557.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Dysuria: is it a urinary tract infection (UTI), and is it SIMPLE?</text>
<text x="557.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">ask: blood in the urine · flank pain · fever · discharge · new partner · rash · new drugs · previous episodes · allergies</text>
<text x="557.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">NOT every burning is a bladder infection: sexually transmitted urethritis, vaginitis, prostatitis, pyelonephritis, skin, drugs</text>
<text x="557.0" y="91.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">(spermicides, cyclophosphamide), atrophic vaginitis, interstitial cystitis, cancer</text>

<text x="417.0" y="181.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">URINARY SYMPTOMS: who is it?</text>
<text x="417.0" y="201.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">burning on voiding ± frequency, urgency</text>
<text x="417.0" y="219.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">LONG-TERM CARE resident: ALWAYS culture + sensitivities (often resistant to trimethoprim-sulfamethoxazole (TMP-SMX),</text>
<text x="417.0" y="237.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">amoxicillin-clavulanate)</text>
