<text x="265.0" y="165.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">all of them RAISE K+: watch it, most in renal insufficiency</text>

<text x="858.0" y="165.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">ACUTE HF with a fast rate: digoxin, or a LOW-dose beta blocker; NOT diltiazem (negative inotrope)</text>
