<text x="677.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">acute pancreatitis is a common cause of epigastric pain in the emergency room; chronic pancreatitis an uncommon cause of</text>

<text x="161.0" y="568.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">pain to the BACK</text>
<text x="55.0" y="588.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• better LEANING FORWARD</text>
<text x="55.0" y="606.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• after a big meal or a binge</text>
<text x="55.0" y="624.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• nausea, vomiting</text>
<rect x="317.0" y="514.0" width="232.0" height="134.0" rx="10" fill="#f3e6d8" stroke="#8a5a2b" stroke-width="1.5"/>
<text x="433.0" y="558.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#8a5a2b" text-anchor="middle">Persistent deep pain</text>
