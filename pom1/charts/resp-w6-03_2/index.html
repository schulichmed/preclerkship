<rect x="197.0" y="10.0" width="760.0" height="78.0" rx="10" fill="#18212e" stroke="#18212e" stroke-width="1.5"/>
<text x="577.0" y="35.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#f6f7f9" text-anchor="middle">Dyspnea or cough not yet diagnosed: what do the PULMONARY FUNCTION TESTS (PFTs) show?</text>
<text x="577.0" y="55.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">read in three steps: SPIROMETRY → static lung VOLUMES → DIFFUSION capacity for carbon monoxide (DLCO)</text>
<text x="577.0" y="73.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#f6f7f9" text-anchor="middle">do NOT test with: aneurysm · pneumothorax · recent brain or eye surgery · BP &gt; 200/120 · recent heart attack or arrhythmia</text>
<rect x="45.0" y="138.0" width="250.0" height="98.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="170.0" y="163.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">FEV1/FVC &lt; 0.7:</text>
<text x="170.0" y="183.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">OBSTRUCTION</text>
<text x="170.0" y="203.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">forced expiratory volume in 1 s (FEV1)</text>
<text x="170.0" y="221.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">↓↓, forced vital capacity (FVC) ↓</text>
<rect x="335.0" y="138.0" width="774.0" height="98.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="722.0" y="182.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">FEV1/FVC NORMAL or ↑: check STATIC LUNG VOLUMES</text>
<text x="722.0" y="202.3" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">total lung capacity (TLC) decides</text>
<rect x="335.0" y="276.0" width="512.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="591.0" y="301.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">TLC &lt; 80%: RESTRICTION. Then the DLCO?</text>
<text x="591.0" y="321.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">FEV1 ↓, FVC ↓ · narrow loop · short, shallow breaths</text>
<rect x="859.0" y="276.0" width="250.0" height="60.0" rx="10" fill="#ffffff" stroke="#c9d0db" stroke-width="1.5"/>
<text x="984.0" y="310.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#18212e" text-anchor="middle">Volumes NORMAL. DLCO?</text>
<rect x="45.0" y="416.0" width="250.0" height="60.0" rx="10" fill="#1f6f8b" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="170.0" y="441.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Obstructive</text>
<text x="170.0" y="461.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">scooped-out flow-volume loop</text>
<rect x="335.0" y="416.0" width="250.0" height="60.0" rx="10" fill="#b5600f" stroke="#b5600f" stroke-width="1.5"/>
<text x="460.0" y="441.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Parenchymal restriction</text>
<text x="460.0" y="461.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">interstitial lung disease (ILD)</text>
<rect x="597.0" y="416.0" width="250.0" height="60.0" rx="10" fill="#1f5f9e" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="722.0" y="441.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Extraparenchymal restriction</text>
<text x="722.0" y="461.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">diaphragm, chest wall, pleura</text>
<rect x="859.0" y="416.0" width="250.0" height="60.0" rx="10" fill="#6a4aa8" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="984.0" y="441.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">Isolated low DLCO</text>
<text x="984.0" y="461.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#ffffff" text-anchor="middle">CO transfer alone is reduced</text>
<rect x="45.0" y="516.0" width="250.0" height="78.0" rx="10" fill="#dceef4" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="170.0" y="541.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">HYPERINFLATION: &gt; 120%</text>
<text x="55.0" y="561.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• residual volume ↑: gas trapping</text>
<text x="55.0" y="579.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• TLC ↑</text>
<rect x="335.0" y="516.0" width="250.0" height="78.0" rx="10" fill="#fbe8d3" stroke="#b5600f" stroke-width="1.5"/>
<text x="460.0" y="541.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">TLC &lt; 80% + DLCO ↓</text>
<text x="460.0" y="561.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">parenchymal disease: less CO taken</text>
<text x="460.0" y="579.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">up</text>
<rect x="597.0" y="516.0" width="250.0" height="78.0" rx="10" fill="#dde9f7" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="722.0" y="550.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">TLC &lt; 80%, DLCO normal</text>
<text x="722.0" y="570.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">altered MECHANICS, not the lung</text>
<rect x="859.0" y="516.0" width="250.0" height="78.0" rx="10" fill="#ebe4f7" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="984.0" y="550.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Spirometry + volumes normal</text>
<text x="984.0" y="570.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">only the DLCO is low</text>
<rect x="45.0" y="634.0" width="250.0" height="96.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="170.0" y="659.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Airways</text>
<text x="55.0" y="679.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• chronic obstructive pulmonary</text>
<text x="62.8" y="697.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">disease (COPD), asthma</text>
<text x="55.0" y="715.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• bronchiectasis, cystic fibrosis</text>
<rect x="45.0" y="752.0" width="250.0" height="98.0" rx="10" fill="#ffffff" stroke="#1f6f8b" stroke-width="1.5"/>
<text x="170.0" y="777.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">Reverses with a</text>
<text x="170.0" y="797.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f6f8b" text-anchor="middle">bronchodilator?</text>
<text x="170.0" y="817.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">see the OBSTRUCTIVE LUNG</text>
<text x="170.0" y="835.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="middle">DISEASE chart</text>
<rect x="335.0" y="634.0" width="250.0" height="216.0" rx="10" fill="#ffffff" stroke="#b5600f" stroke-width="1.5"/>
<text x="460.0" y="692.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#b5600f" text-anchor="middle">The lung</text>
<text x="345.0" y="712.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• idiopathic pulmonary fibrosis,</text>
<text x="352.8" y="730.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">sarcoidosis</text>
<text x="345.0" y="748.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• granulomatosis with polyangiitis, drug</text>
<text x="352.8" y="766.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">toxicity</text>
<text x="345.0" y="784.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• pneumonia, acute respiratory distress</text>
<text x="352.8" y="802.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">syndrome</text>
<rect x="597.0" y="634.0" width="250.0" height="97.0" rx="10" fill="#ffffff" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="722.0" y="668.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Neuromuscular</text>
<text x="607.0" y="688.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• myasthenia gravis, Guillain-Barré</text>
<text x="607.0" y="706.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• amyotrophic lateral sclerosis, polio</text>
<rect x="597.0" y="753.0" width="250.0" height="97.0" rx="10" fill="#ffffff" stroke="#1f5f9e" stroke-width="1.5"/>
<text x="722.0" y="787.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#1f5f9e" text-anchor="middle">Chest wall</text>
<text x="607.0" y="807.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• scoliosis</text>
<text x="607.0" y="825.9" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• severe obesity, ascites</text>
<rect x="859.0" y="634.0" width="250.0" height="106.0" rx="10" fill="#ffffff" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="984.0" y="664.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Blood or vessels</text>
<text x="869.0" y="684.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• anemia: no red cells to take up CO</text>
<text x="869.0" y="702.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• pulmonary embolism, pulmonary</text>
<text x="876.8" y="720.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">hypertension</text>
<rect x="859.0" y="762.0" width="250.0" height="88.0" rx="10" fill="#ffffff" stroke="#6a4aa8" stroke-width="1.5"/>
<text x="984.0" y="792.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="14.5" font-weight="700" fill="#6a4aa8" text-anchor="middle">Early lung disease</text>
<text x="869.0" y="812.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• early ILD or pneumonia</text>
<text x="869.0" y="830.4" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#18212e" text-anchor="start">• non-obstructive emphysema</text>
<text x="170.0" y="376.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">air TRAPPED</text>
<text x="460.0" y="376.0" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#5a6577" text-anchor="middle" stroke="#f6f7f9" stroke-width="5" stroke-linejoin="round" paint-order="stroke">DLCO ↓</text>
