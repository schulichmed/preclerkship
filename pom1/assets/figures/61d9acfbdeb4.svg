<svg xmlns="http://www.w3.org/2000/svg" width="1124" height="872" viewBox="0 0 1124 872" role="img" aria-labelledby="t"><title id="t">Reading pulmonary function tests in three steps: an FEV1/FVC ratio under 0.7 is obstruction with hyperinflation; otherwise static volumes decide, a total lung capacity under 80% is restriction, and the diffusion capacity then separates parenchymal (reduced) from extraparenchymal (normal) restriction; normal volumes with a low diffusion capacity point to anemia, pulmonary vascular disease or early lung disease</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5a6577"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#f6f7f9"/>
<rect x="40" y="408" width="260" height="450" rx="16" fill="#eef7fa" stroke="#1f6f8b" stroke-opacity="0.25"/>
<rect x="330" y="408" width="260" height="450" rx="16" fill="#fdf4ea" stroke="#b5600f" stroke-opacity="0.25"/>
<rect x="592" y="408" width="260" height="450" rx="16" fill="#eff5fc" stroke="#1f5f9e" stroke-opacity="0.25"/>
<rect x="854" y="408" width="260" height="450" rx="16" fill="#f5f1fb" stroke="#6a4aa8" stroke-opacity="0.25"/>
<path d="M33 516H29V594H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 555.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">VOLUMES · DLCO</text>
<path d="M33 634H29V850H33" fill="none" stroke="#c9d0db" stroke-width="1.5"/>
<text x="0" y="0" transform="translate(23 742.0) rotate(-90)" text-anchor="middle" font-family="Arial, 'Segoe UI Symbol', 'Liberation Sans', Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5a6577">CAUSES</text>
<path d="M984.0 336.0L984.0 414.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M984.0 594.0L984.0 632.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
<path d="M984.0 476.0L984.0 514.0" fill="none" stroke="#5a6577" stroke-width="2" marker-end="url(#ah)"/>
